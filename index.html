<!DOCTYPE html>
<html lang="es">

<style>
:root{--bg:#F3EBDD;--ink:#16130F;--muted:#5B544A;--card:#fff;--line:#E4D9C6;--acc:#FF4A1C;--accd:#C93410;--acc2:#FFE3D8;--knob:#F3EBDD;--ok:#2f7d4a;--okbg:#e7f4ea;--warn:#b45309;--warnbg:#fff4dc;--bad:#b42318;--badbg:#fdecea;--blue:#2848a8;--bluebg:#e8eefc;--wa:#1fa855;--wabg:#efeae2;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:17px;margin-bottom:12px}
small{color:var(--muted);display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px}
button:hover{border-color:#cfc6b4}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accd);border-color:var(--accd);color:#fff;font-weight:700}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:13px}
button.bad{color:var(--bad)}
button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
button.link{border:0;padding:0;background:none;color:var(--accd);text-decoration:underline;font-size:13px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label input,label select{margin-top:4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;padding:8px 0;border-bottom:1px dashed var(--line);margin:0}
label.chk span{margin-left:auto;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.row+.row{border-top:1px dashed var(--line)}
.row.big{font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#f0ece3;color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.blue{background:var(--bluebg);color:var(--blue)}
.st-nuevo{background:var(--bluebg);color:var(--blue)}.st-preparando{background:var(--warnbg);color:var(--warn)}.st-listo,.st-entregado,.st-enviado{background:var(--okbg);color:var(--ok)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f1ede4;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:5px 8px}
tr.low td{background:#fff8ef}
tr.off td{opacity:.5}
tfoot td{font-weight:700;border-bottom:0}
.tablewrap{overflow-x:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--ink);color:#fff}
.top small{color:#bdb6a8}
.brand{display:flex;gap:10px;align-items:center}
.tc{display:inline-flex;align-items:center;gap:.13em;font-family:Unbounded,sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.tc i{display:flex;justify-content:flex-end;align-items:center;width:1.04em;height:.57em;border-radius:.285em;background:var(--acc);padding:0 .07em;box-sizing:border-box}
.tc i::after{content:"";width:.43em;height:.43em;border-radius:50%;background:var(--knob)}
.top .tc{font-size:24px;--knob:var(--ink);color:var(--bg)}
.nube{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}.nube.ok{background:#1f3a29;color:#9be3b5}.nube.off{background:#4a2a12;color:#ffc58f}
.pin{-webkit-text-security:disc;text-security:disc}
.tagline{font-weight:600;color:var(--muted);margin:12px 0 0}
.who{display:flex;gap:8px;align-items:center}
.who .ghost{color:#fff;border-color:#4a463f}
nav{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;white-space:nowrap;border-radius:9px;color:var(--muted);font-weight:500}
nav button.on{background:var(--acc2);color:var(--accd);font-weight:700}
nav .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.ptitle{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ptitle h1{font:700 24px Unbounded,sans-serif;letter-spacing:-.02em}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:360px;text-align:center;padding:28px}
.login .tc{font-size:44px;margin:6px 0 2px}
.login form{display:grid;gap:10px;margin:18px 0 10px}
.hint{font-size:13px;color:var(--muted);background:#f7f4ee;border-radius:10px;padding:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:23px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.hi{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.hi small{color:#bdb6a8}
.kpi.acc{border-color:var(--acc);background:var(--acc2)}
/* salón */
.salon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa-c{text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px;min-height:110px;background:#fff;display:flex;flex-direction:column;gap:4px}
.mesa-c b{font:700 18px Unbounded,sans-serif}
.mesa-c.ocupada{border-color:#e6b866;background:#fffaf0}
.mesa-c.cuenta{border-color:var(--bad);background:var(--badbg)}
.mesa-c.llama{box-shadow:0 0 0 3px var(--blue)}
.mesa-c .chip{white-space:normal;text-align:left}
.mesa-c .tot{margin-top:auto;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:2px solid var(--line)}
/* cocina */
.col h2{display:flex;justify-content:space-between}
.ticket{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:10px}
.ticket.whatsapp{border-left-color:var(--wa)}
.ticket .th{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ticket .th b{font-size:18px}
.ticket .time{margin-left:auto}
.ticket ul{margin:0 0 8px;padding-left:18px}
.ticket li small{display:block;color:var(--warn);font-weight:600}
.ticket .nota{background:var(--warnbg);border-radius:8px;padding:5px 8px;margin:0 0 8px;font-size:13px}
.ticket .dir{font-size:13px;margin:0 0 8px;color:var(--muted)}
.ticket>button{width:100%}
.empty{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--ink);color:#fff}
/* caja */
.grp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grp.alerta{border-color:var(--warn);background:#fffaf0}
.grp .row{padding:0}
.saldo{border-color:var(--ink)}
.lock{display:flex;gap:12px;align-items:center;background:#f7f4ee;font-size:22px}
.lock b{font-size:15px}.lock small{font-size:14px}
.ok{color:var(--ok)}.badt{color:var(--bad)}
.pagos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbsum{background:#f7f4ee;border-radius:12px;padding:10px 12px;margin:10px 0}
/* cliente */
.cli{max-width:520px;margin:0 auto}
.cli.full{padding:0 0 30px}
.cli-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:22px 18px;background:var(--ink);color:#fff;border-radius:0 0 22px 22px;margin-bottom:12px}
.cli:not(.full) .cli-h{border-radius:var(--r)}
.cli-h small{color:#bdb6a8}
.cli-h h1{font:700 22px Unbounded,sans-serif;letter-spacing:-.02em}
.cli-h select{width:auto;background:var(--accd);color:#fff;border:0;font-weight:700;border-radius:99px}
.mesa{background:var(--accd);padding:6px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.cli-acts{display:flex;gap:8px;margin:0 12px 6px}
.cli-acts button{flex:1}
.cli .cat{font:700 17px Unbounded,sans-serif;margin:18px 16px 8px}
.dish{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 12px 8px}
.dish.off{opacity:.55}
.dish .price{font-weight:700;color:var(--accd)}
.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty button{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;font-weight:700}
.qty button[data-a=mas]{background:var(--accd);color:#fff;border-color:var(--accd)}
.mis{margin:0 12px 12px}
.mis h3{margin-bottom:6px}
button.mp{background:#009ee3;color:#fff;border-color:#009ee3;font-weight:700}
.cartbar{position:sticky;bottom:12px;margin:14px 12px 0;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.staff{text-align:center;font-size:13px;margin-top:30px;color:var(--muted)}.staff .tc{font-size:14px;vertical-align:-2px}.staff a{color:var(--muted)}
/* whatsapp */
.wa-wrap{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.wa-wrap{grid-template-columns:1fr}}
.phone{border-radius:24px;overflow:hidden;border:8px solid #1f1d1a;background:var(--wabg);display:flex;flex-direction:column;height:660px}
.wa-h{background:#075e54;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 12px}
.wa-h small{color:#cde7e2}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.wa-tel{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#dfe9e6;font-size:12px;color:#33524c}
.wa-tel input{padding:3px 8px;font-size:12px;width:140px}
.wa-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:7px 10px 4px;border-radius:10px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg small{text-align:right;font-size:10px}
.msg.user{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
.msg.bot{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.msg.sys{align-self:center;background:#fff3c4;font-size:12px;text-align:center}
.wachips{display:flex;gap:5px;overflow-x:auto;padding:6px 8px;background:#f0f0f0}
.wachips button{font-size:12px;padding:4px 9px;border-radius:99px;white-space:nowrap}
.wa-in{display:flex;gap:6px;padding:8px;background:#f0f0f0}
.wa-in input{border-radius:99px}
.wa-in button{border-radius:50%;width:42px;background:var(--wa);color:#fff;border-color:var(--wa)}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
/* qr */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.qr{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff}
.qr b{display:block;font:700 15px Unbounded,sans-serif;margin-bottom:8px}
.qrc{display:flex;justify-content:center;margin-bottom:8px;min-height:120px;align-items:center;font-size:12px;color:var(--muted)}
.qrc img,.qrc canvas{width:120px;height:120px}
.qr small{margin-bottom:6px}
/* reportes */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.bar b{font-size:10px;color:var(--ink);font-weight:600;margin-bottom:2px}
.cls-estrella{background:var(--okbg);color:var(--ok)}.cls-caballo{background:var(--warnbg);color:var(--warn)}.cls-enigma{background:var(--bluebg);color:var(--blue)}.cls-perro{background:var(--badbg);color:var(--bad)}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(20,18,15,.5);display:grid;place-items:center;padding:16px;z-index:20}
.mod{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.mod.wide{max-width:720px}
.mod h2{font:700 19px Unbounded,sans-serif;letter-spacing:-.02em}
.erow{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.erow.m{grid-template-columns:1.6fr 1fr 1.4fr .8fr .9fr auto}
.erow input,.erow select{padding:6px 8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;display:grid;gap:6px}
.t{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.t.err{background:var(--bad)}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline label{flex:1;min-width:120px;margin:0}
details summary{cursor:pointer}
details ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.alerts .chip{margin:0 6px 6px 0}
</style>
</head>

function errMsg(e){const m=String((e&&(e.message||e.error_description||e.msg))||e||'');
  if(/invalid login/i.test(m))return'Email o contraseña incorrectos';
  if(/not confirmed/i.test(m))return'Todavía no confirmaste tu email: revisá tu casilla (y la carpeta de spam)';
  if(/already registered|already been registered/i.test(m))return'Ya hay una cuenta con ese email: entrá con tu contraseña';
  if(/at least 6|password should/i.test(m))return'La contraseña tiene que tener al menos 6 caracteres';
  if(/rate limit|too many|security purposes/i.test(m))return'Demasiados intentos seguidos, esperá unos minutos';
  if(/invalid.*email|email.*invalid/i.test(m))return'Revisá el email, parece que está mal escrito';
  if(/fetch|network|failed to/i.test(m))return'Sin conexión, probá de nuevo';
  return m||'Algo salió mal, probá de nuevo';}

  AUTH.cargando=false;
  NB.auth.onCambio((ev,u)=>{if(ev==='PASSWORD_RECOVERY'){AUTH.recuperando=true}
    const antes=AUTH.user&&AUTH.user.id;AUTH.user=u;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- líneas con modificadores ---------- */
function lineInfo(l){
  const p=plato(l.id),mods=(l.mods||[]).map(m=>p.mods.find(x=>x.id===m)).filter(Boolean);
  const receta={...p.receta};
  mods.forEach(m=>{if(m.tipo==='quita')delete receta[m.ins];else receta[m.ins]=r3((receta[m.ins]||0)+m.cant)});
  return{p,mods,receta,precio:p.precio+mods.reduce((a,m)=>a+(+m.precio||0),0)};
}
function needFor(lines){const need={};lines.forEach(l=>{const{receta}=lineInfo(l);Object.entries(receta).forEach(([i,c])=>need[i]=r3((need[i]||0)+c*l.cant))});return need}
function faltante(lines){for(const [ins,c] of Object.entries(needFor(lines))){const i=insumo(ins);if(!i||i.stock<c-1e-9)return i?i:{nombre:ins}}return null}
const lineKey=(id,mods)=>id+'|'+[...mods].sort().join(',');
const itemTxt=i=>`${i.cant}× ${esc(i.nombre)}${i.mods&&i.mods.length?' ('+esc(i.mods.join(', '))+')':''}`;

/* ---------- lógica del negocio ---------- */
function armarPedido(o){
  const f=faltante(o.lines);
  if(f){const pl=o.lines.map(l=>lineInfo(l)).find(x=>x.receta[f.id]);return{error:`No alcanza el stock para ${pl?pl.p.nombre:'el pedido'} (falta ${f.nombre})`}}
  const need=needFor(o.lines);
  const items=o.lines.map(l=>{const x=lineInfo(l);return{id:x.p.id,nombre:x.p.nombre,precio:x.precio,cant:l.cant,mods:x.mods.map(m=>m.nombre),modIds:l.mods||[],area:x.p.area||'cocina'}});
  const subtotal=items.reduce((a,i)=>a+i.precio*i.cant,0),envio=o.origen==='whatsapp'?S.envio:0;
  return{need,ped:{origen:o.origen,por:o.por||'',mesa:o.mesa||null,cliente:o.cliente||'',tel:o.tel||'',direccion:o.direccion||'',items,subtotal,envio,total:subtotal+envio,estado:'nuevo',medio:o.medio||null,cobrado:false,pideCuenta:false,consumo:need,anulado:false,nota:o.nota||''}};
}
function crearPedido(o){
  const a=armarPedido(o);if(a.error)return a;
  for(const [ins,c] of Object.entries(a.need)){const i=insumo(ins);i.stock=r3(i.stock-c)}
  const ped=Object.assign({id:uid(),num:S.nextNum++,ts:Date.now()},a.ped);
  S.pedidos.push(ped);save();return ped;
}
function anular(p){if(p.anulado)return;for(const [ins,c] of Object.entries(p.consumo)){const i=insumo(ins);if(i)i.stock=r3(i.stock+c)}p.anulado=true}
function siguiente(p){return{nuevo:'preparando',preparando:'listo',listo:p.origen==='whatsapp'?'enviado':'entregado'}[p.estado]}
function avanzar(p){
  p.estado=siguiente(p);
  if(p.origen==='whatsapp'&&p.tel===S.wa.tel){
    const t={preparando:`👨‍🍳 Tu pedido *#${p.num}* ya está en preparación.`,listo:`✅ Tu pedido *#${p.num}* está listo, lo estamos por despachar.`,enviado:`🛵 ¡Tu pedido *#${p.num}* salió para ${p.direccion}! Total a pagar: *${fmt(p.total)}*.`}[p.estado];
    if(t)S.wa.msgs.push({from:'bot',t,ts:Date.now()});
  }
  save();
}
function registrarMerma(ins,cant,motivo){
  const i=insumo(ins);if(!(cant>0))return 'Cantidad inválida';if(cant>i.stock+1e-9)return 'La merma supera el stock disponible';
  i.stock=r3(i.stock-cant);S.mermas.push({id:uid(),ins,cant,motivo,valor:cant*i.costo,ts:Date.now(),por:yo()});
  audit('Merma',`${num(cant)} ${i.u} ${i.nombre} · ${motivo}`,cant*i.costo);save();
}
function abiertos(){return S.pedidos.filter(p=>!p.anulado&&!p.cobrado)}
function grupos(){
  const g={};
  abiertos().forEach(p=>{
    const k=p.origen==='mesa'?'m'+p.mesa:p.origen==='mostrador'?'p'+p.num:'w'+p.num;
    g[k]=g[k]||{key:k,nombre:p.origen==='mesa'?'Mesa '+p.mesa:p.origen==='mostrador'?'🥡 Para llevar #'+p.num+' · '+p.cliente:'🛵 Delivery #'+p.num+' · '+p.cliente,peds:[],total:0,cuenta:false,medioDecl:null};
    g[k].peds.push(p);g[k].total+=p.total;if(p.pideCuenta)g[k].cuenta=true;if(p.medio)g[k].medioDecl=p.medio;
  });
  return Object.values(g).sort((a,b)=>b.cuenta-a.cuenta);
}

function registrarCobro(peds,o){
  const c={id:uid(),ts:Date.now(),turno:S.turno?S.turno.id:null,por:o.por||yo(),grupo:o.nombre,pedidos:peds.map(p=>p.id),subtotal:o.subtotal,descPct:o.descPct||0,descuento:o.descuento||0,propina:o.propina||0,total:o.total,pagos:o.pagos,anulado:false};
  peds.forEach(p=>{p.cobrado=true;p.cobroId=c.id;p.pideCuenta=false});
  S.cobros.push(c);
  if(c.descuento>0)audit('Descuento',`${c.grupo}: ${c.descPct}%`,c.descuento);

function calc(){
  const v=S.pedidos.filter(p=>!p.anulado),cobs=S.cobros.filter(c=>!c.anulado);
  const porMedio={efectivo:0,mp:0,tarjeta:0,transferencia:0};cobs.forEach(c=>Object.entries(c.pagos).forEach(([m,x])=>porMedio[m]+=x));
  const porCanal={QR:0,Mozo:0,WhatsApp:0,Mostrador:0};v.forEach(p=>porCanal[p.origen==='whatsapp'?'WhatsApp':p.origen==='mostrador'?'Mostrador':p.por==='QR'?'QR':'Mozo']+=p.total);
  const brutas=v.reduce((a,p)=>a+p.total,0),descuentos=cobs.reduce((a,c)=>a+c.descuento,0),propinas=cobs.reduce((a,c)=>a+c.propina,0);
  const ventas=brutas-descuentos,pendiente=v.filter(p=>!p.cobrado).reduce((a,p)=>a+p.total,0);
  const egresos=S.egresos.reduce((a,e)=>a+e.monto,0),saldo=S.apertura+porMedio.efectivo-egresos;
  const consumo={};v.forEach(p=>Object.entries(p.consumo).forEach(([i,c])=>consumo[i]=r3((consumo[i]||0)+c)));
  const costoVendido=Object.entries(consumo).reduce((a,[i,c])=>a+c*(insumo(i)?insumo(i).costo:0),0);
  const merma={};S.mermas.forEach(m=>{merma[m.ins]=merma[m.ins]||{cant:0,valor:0};merma[m.ins].cant=r3(merma[m.ins].cant+m.cant);merma[m.ins].valor+=m.valor});
  const costoMerma=S.mermas.reduce((a,m)=>a+m.valor,0),stockValor=S.insumos.reduce((a,i)=>a+i.stock*i.costo,0);
  const platos={};v.forEach(p=>p.items.forEach(i=>{platos[i.id]=platos[i.id]||{nombre:i.nombre,cant:0,ventas:0};platos[i.id].cant+=i.cant;platos[i.id].ventas+=i.precio*i.cant}));
  const porHora={};v.forEach(p=>{const h=new Date(p.ts).getHours();porHora[h]=(porHora[h]||0)+p.total});
  return{v,cobs,porMedio,porCanal,brutas,descuentos,propinas,ventas,pendiente,egresos,saldo,consumo,costoVendido,merma,costoMerma,stockValor,platos,porHora,
    bajos:S.insumos.filter(i=>i.stock<=i.min),tickets:v.length,ganancia:ventas-costoVendido-costoMerma};
}
function ingenieria(c){
  const rows=S.platos.map(p=>{const x=c.platos[p.id]||{cant:0,ventas:0};const costo=costoReceta(p.receta);return{p,cant:x.cant,margen:p.precio-costo,pct:p.precio?1-costo/p.precio:0}}).filter(r=>r.p.activo!==false);
  const tot=rows.reduce((a,r)=>a+r.cant,0);if(!tot)return[];
  const popMin=tot/rows.length*.7,margProm=rows.reduce((a,r)=>a+r.margen*r.cant,0)/tot;
  return rows.map(r=>{const pop=r.cant>=popMin,rent=r.margen>=margProm;
    r.cls=pop&&rent?['estrella','⭐ Estrella','Mantenela y destacala en la carta']:pop?['caballo','🐴 Caballo de batalla','Se vende mucho pero deja poco: subí un poco el precio o bajá el costo']:rent?['enigma','🧩 Enigma','Deja buena ganancia pero se pide poco: promocionala o que la recomiende el mozo']:['perro','🐶 Perro','Se vende poco y deja poco: revisala o sacala de la carta'];return r}).sort((a,b)=>b.cant-a.cant);
}

function cbCalc(){const max=rol==='dueno'?100:S.descMax;const desc=Math.min(Math.max(pdec(CB.desc),0),100);const total=Math.round(CB.subtotal*(1-desc/100));const propina=Math.round(total*CB.prop/100);

/* impresión (impresora térmica de 80 mm) */
function imprimir(titulo,cuerpo){
  const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>@page{size:80mm auto;margin:3mm}body{font:13px/1.35 'Courier New',monospace;width:72mm;margin:0;color:#000}h1{font-size:17px;margin:0 0 2px;text-align:center}h2{font-size:22px;margin:4px 0;text-align:center}.c{text-align:center}.r{display:flex;justify-content:space-between;gap:6px}.big{font-size:16px;font-weight:700}.it{font-size:16px;font-weight:700;margin:4px 0 0}.m{font-size:13px;padding-left:14px}hr{border:0;border-top:1px dashed #000;margin:6px 0}.pb{page-break-after:always}pre{white-space:pre-wrap;font:inherit;margin:0}</style></head><body>${cuerpo}</body></html>`);d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('No se pudo imprimir desde acá',1)}setTimeout(()=>f.remove(),60000)},300);
}

/* reservas por WhatsApp */
const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function leerReserva(t,r){
  const hoyD=new Date();hoyD.setHours(0,0,0,0);const mas=n=>{const d=new Date(hoyD);d.setDate(d.getDate()+n);return fechaISO(d)};
  if(/pasado manana/.test(t))r.fecha=mas(2);else if(/\bmanana\b/.test(t))r.fecha=mas(1);else if(/\bhoy\b|esta noche/.test(t))r.fecha=mas(0);
  else{const i=DIAS.findIndex(d=>new RegExp('\\b'+d+'\\b').test(t));if(i>=0)r.fecha=mas((i-hoyD.getDay()+7)%7);
    const m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){let y=m[3]?+m[3]:hoyD.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&d<hoyD)d.setFullYear(y+1);r.fecha=fechaISO(d)}}
  const sin=t.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ');
  const h=sin.match(/a las? (\d{1,2})(?:[:.](\d{2}))?/)||sin.match(/\b(\d{1,2})[:.](\d{2})\b/)||sin.match(/\b(\d{1,2})\s*(?:hs|h|horas)\b/);
  if(h){let H=+h[1];const M=h[2]?+h[2]:0;if(H>=1&&H<=11&&!/manana|mediodia/.test(t.slice(h.index)))H+=12;if(H<=23&&M<=59)r.hora=String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')}
  const p=sin.match(/para (\d{1,2})\b/)||sin.match(/\b(\d{1,2})\s*(?:personas|pers|comensales)\b/)||sin.match(/somos (\d{1,2})\b/);
  if(p)r.personas=+p[1];else{const w=sin.match(/(?:para|somos) (una?|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\b/);if(w)r.personas=NUMS[w[1]]}
  return r;
}
function pasoReserva(txt){
  const wa=S.wa,r=leerReserva(norm(txt),wa.draft.res||{}),cl=cliente();wa.draft.res=r;
  if(wa.step==='res_nombre'){r.nombre=txt.trim().slice(0,40)}
  const falta=[!r.fecha&&'el día',!r.hora&&'la hora',!r.personas&&'cuántas personas'].filter(Boolean);
  if(falta.length){wa.step='res';return[`¡Dale! Pasame ${falta.join(', ').replace(/, ([^,]*)$/,' y $1')} 🙂\nPor ejemplo: *mañana a las 21:30 para 4*`]}
  if(r.fecha<fechaISO()||(r.fecha===fechaISO()&&r.hora<new Date().toTimeString().slice(0,5))){delete r.hora;wa.step='res';return['Esa hora ya pasó 😅 ¿Para qué otro horario?']}
  if(r.personas>20){wa.step='res';return['Para grupos de más de 20 personas escribinos y lo armamos especialmente 🙌']}
  const t=x=>{const[a,b]=x.split(':').map(Number);return a*60+b};
  if(S.reservas.filter(x=>x.fecha===r.fecha&&x.estado==='confirmada'&&Math.abs(t(x.hora)-t(r.hora))<90).length>=Math.ceil(S.mesas*.6)){delete r.hora;wa.step='res';return[`Uh, a esa hora estamos completos 😕 ¿Te sirve un poco antes o más tarde?`]}
  if(!r.nombre){const prev=S.reservas.filter(x=>x.tel===wa.tel).pop();if(cl)r.nombre=cl.nombre;else if(prev)r.nombre=prev.nombre;else{wa.step='res_nombre';return['¿A nombre de quién la anoto?']}}
  wa.step='res_ok';
  return[`📅 *Tu reserva*\n${fechaLinda(r.fecha).replace(/^./,c=>c.toUpperCase())} a las *${r.hora}*\n${r.personas} persona${r.personas>1?'s':''} · a nombre de *${r.nombre}*\n\nRespondé *SI* para confirmar.`];
}
function botReserva(t,txt){
  const wa=S.wa;
  if(/cancel\w* (la |mi )?reserva/.test(t)){
    const r=S.reservas.filter(x=>x.tel===wa.tel&&x.estado==='confirmada'&&x.fecha>=fechaISO()).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora))[0];
    if(!r)return['No encontré reservas tuyas a confirmar 🤔'];
    r.estado='cancelada';audit('Reserva cancelada',`${r.nombre} · ${r.fecha} ${r.hora} (por WhatsApp)`);if(wa.step.startsWith('res'))wa.step='inicio';
    return[`Listo, cancelé tu reserva del ${fechaLinda(r.fecha)} a las ${r.hora}. ¡Gracias por avisar! 🙏`];
  }
  if(wa.step.startsWith('res')){
    if(/^(chau|salir|nada|olvidate|dejalo)/.test(t)){wa.step='inicio';wa.draft={};return['Listo 👍 Cuando quieras escribí *reservar* o pedí de la carta.']}
    if(!/reserv/.test(t)&&parsear(t).lines.length){wa.step='inicio';wa.draft={};return null}
  }
  if(wa.step==='res_ok'){
    if(/^(si|dale|ok|confirmo|de una)/.test(t)){const r=wa.draft.res;
      S.reservas.push({id:uid(),nombre:r.nombre,tel:wa.tel,personas:r.personas,fecha:r.fecha,hora:r.hora,mesa:null,nota:'Pidió por WhatsApp',estado:'confirmada',ts:Date.now(),por:'WhatsApp'});
      wa.step='inicio';wa.draft={};
      return[`✅ ¡Reserva confirmada! Te esperamos.\nSi no podés venir, escribí *cancelar reserva* así liberamos la mesa.`]}
    if(/^no\b|cancel/.test(t)){wa.step='inicio';wa.draft={};return['Listo, no la anoto. Si querés otro horario escribí *reservar*.']}
    return pasoReserva(txt);
  }
  if(wa.step.startsWith('res')){if(/^(cancel|salir|chau)/.test(t)){wa.step='inicio';wa.draft={};return['Listo 👍']}return pasoReserva(txt)}
  if(/reserv/.test(t)){wa.step='res';wa.draft={res:{}};const r=pasoReserva(txt);return r}
  return null;
}

/* ---------- asistente de WhatsApp ---------- */
const NUMS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
function parsear(t){
  const out={},notas=[];
  norm(t).split(/,|\by\b|\be\b|\n|\+|;/).forEach(seg=>{
    seg=seg.trim();if(!seg)return;
    const ac=seg.match(/\b(sin|con|extra|bien|jugosa?|a punto)\b.*$/);
    const p=activos().find(p=>p.alias.some(a=>seg.includes(a)));
    if(!p){if(ac&&/^(una?|la|el)?\s*(sin|con|extra|bien)/.test(seg))notas.push(seg.replace(/^(una?|la|el)\s+/,''));return}
    let q=1;const m=seg.match(/(\d+)/);
    if(m)q=+m[1];else{for(const w in NUMS)if(new RegExp('\\b'+w+'\\b').test(seg)){q=NUMS[w];break}}
    out[p.id]=(out[p.id]||0)+q;
    if(ac&&!p.alias.some(a=>ac[0].includes(a)))notas.push(p.nombre+': '+ac[0]);
  });
  return{lines:Object.entries(out).map(([id,cant])=>({id,cant,mods:[]})),nota:notas.join(' · ')};
}
function cartaTxt(){const ps=activos(),cats=[...new Set(ps.map(p=>p.cat))];return'📋 *Nuestra carta*\n'+cats.map(c=>`\n*${c}*\n`+ps.filter(p=>p.cat===c).map(p=>`• ${p.nombre} — ${fmt(p.precio)}${disp(p)<=0?' (agotado)':''}`).join('\n')).join('\n')+`\n\n🛵 Envío: ${fmt(S.envio)}`}
function resumenItems(lines){const sub=lines.reduce((a,l)=>a+lineInfo(l).precio*l.cant,0);return lines.map(l=>`• ${l.cant}× ${plato(l.id).nombre} — ${fmt(lineInfo(l).precio*l.cant)}`).join('\n')+`\n• Envío — ${fmt(S.envio)}\n*Total: ${fmt(sub+S.envio)}*`}
function cliente(){return S.clientes[S.wa.tel]}
function pasoResumen(lines,nota){
  const f=faltante(lines);
  if(f){S.wa.step='pedido';const pl=lines.map(lineInfo).find(x=>x.receta[f.id]);return[`Uy, ${pl?'de '+pl.p.nombre:'eso'} no nos queda suficiente hoy 😕 (quedan ${pl?disp(pl.p):0}). ¿Querés cambiar algo?`]}
  S.wa.draft={lines,nota};const cl=cliente();
  const out=['Perfecto, te anoto:\n'+resumenItems(lines)+(nota?`\n📝 ${nota}`:'')];
  if(cl){S.wa.draft.cliente=cl.nombre;S.wa.draft.direccion=cl.dir;S.wa.step='pago';out.push(`Te lo mandamos a *${cl.dir}* como siempre (si es otra, escribí *otra dirección*).\n¿Cómo vas a pagar?\n1️⃣ Efectivo\n2️⃣ Transferencia\n3️⃣ Mercado Pago`)}
  else{S.wa.step='datos';out.push('¿A nombre de quién y a qué dirección lo mandamos? (por ejemplo: *Juan, San Martín 1234*)')}
  return out;
}
function bot(txt){
  const t=norm(txt),wa=S.wa,cl=cliente();
  const rv=botReserva(t,txt);if(rv)return rv;
  if(/\bcancel/.test(t)){wa.step='inicio';wa.draft={};return['Listo, cancelé el pedido. Cuando quieras escribí *menú* para empezar de nuevo.']}
  if(/^estado\b|como va mi pedido|donde esta mi pedido/.test(t)){const p=S.pedidos.find(p=>p.id===wa.ultimo);return[p?`Tu pedido *#${p.num}* está: *${ESTADO[p.estado]}*${p.anulado?' (anulado)':''}.`:'Todavía no tenés pedidos hechos. Escribí *menú* para ver la carta.']}
  if(/^(menu|carta)\b/.test(t)){wa.step='pedido';return[cartaTxt(),'Escribí lo que querés, por ejemplo: *2 hamburguesas y 1 coca*']}
  if(/lo de siempre|lo mismo|repetir/.test(t)){if(cl&&cl.ultItems)return pasoResumen(cl.ultItems.filter(l=>plato(l.id)),'');return['Todavía no tengo un pedido tuyo guardado 🙂 Decime qué querés, o escribí *menú*.']}
  if(wa.step==='inicio'||(wa.step==='pedido'&&/^(hola|buenas|buen dia)/.test(t))){
    const r=parsear(t);if(r.lines.length)return pasoResumen(r.lines,r.nota);
    wa.step='pedido';
    if(cl&&cl.ultItems)return[`¡Hola ${cl.nombre}! 👋 Qué bueno verte de nuevo.\n¿Te mando *lo de siempre*? (${cl.ultItems.map(l=>l.cant+'× '+(plato(l.id)||{}).nombre).join(', ')})\nO escribí *menú* para ver la carta.`];
    return[`¡Hola! 👋 Soy el asistente de *${S.negocio}*. Te tomo el pedido para delivery o te anoto una reserva.`,cartaTxt(),'Escribí lo que querés, por ejemplo: *2 hamburguesas sin tomate y 1 coca*\nPara reservar mesa escribí *reservar*.'];
  }
  if(wa.step==='pedido'){const r=parsear(t);if(!r.lines.length)return['No te entendí 🙈. Decime qué querés de la carta, por ejemplo: *1 pizza y 2 cervezas*. O escribí *menú* para verla.'];return pasoResumen(r.lines,r.nota)}
  if(wa.step==='datos'){
    if(t.length<5)return['Pasame nombre y dirección completa, por favor 🙏'];
    const i=txt.indexOf(',');wa.draft.cliente=i>0?txt.slice(0,i).trim():'Cliente';wa.draft.direccion=i>0?txt.slice(i+1).trim():txt.trim();
    wa.step='pago';return[`Genial, ${wa.draft.cliente}. ¿Cómo vas a pagar?\n1️⃣ Efectivo\n2️⃣ Transferencia\n3️⃣ Mercado Pago`];
  }
  if(wa.step==='pago'){
    if(/otra direc|cambiar direc/.test(t)){wa.step='datos';return['Dale, pasame nombre y la dirección nueva (ej: *Juan, San Martín 1234*).']}
    const m=/^1|efect/.test(t)?'efectivo':/^2|transf/.test(t)?'transferencia':/^3|mercado|^mp/.test(t)?'mp':null;
    if(!m)return['Respondé *1*, *2* o *3* para elegir la forma de pago.'];
    wa.draft.medio=m;wa.step='confirmar';
    return[`📝 *Resumen del pedido*\n${resumenItems(wa.draft.lines)}${wa.draft.nota?`\n📝 ${wa.draft.nota}`:''}\n📍 ${wa.draft.direccion}\n💳 ${MEDIO[m]}${m==='transferencia'?`\nAlias: ${S.alias}`:''}${m==='mp'?'\nTe mandamos el link de pago al confirmar.':''}\n\nRespondé *SI* para confirmar o *cancelar*.`];
  }
  if(wa.step==='confirmar'){
    if(/^(si|dale|ok|confirmo|de una)/.test(t)){
      const d=wa.draft,r=crearPedido({origen:'whatsapp',por:'WhatsApp',cliente:d.cliente,direccion:d.direccion,tel:wa.tel,lines:d.lines,medio:d.medio,nota:d.nota});
      if(r.error){wa.step='pedido';return['Uy, justo se nos acabó algo: '+r.error+'. ¿Querés pedir otra cosa?']}
      const c=S.clientes[wa.tel]||{tel:wa.tel,pedidos:0,gastado:0};
      Object.assign(c,{nombre:d.cliente,dir:d.direccion,pedidos:c.pedidos+1,gastado:c.gastado+r.total,ult:Date.now(),ultItems:d.lines});S.clientes[wa.tel]=c;
      wa.ultimo=r.id;wa.step='inicio';wa.draft={};
      return[`✅ ¡Pedido *#${r.num}* confirmado y enviado a la cocina!\nDemora estimada: 35 a 45 min.\nEscribí *estado* cuando quieras saber cómo va.`];
    }
    if(/^no\b/.test(t)){wa.step='inicio';wa.draft={};return['Listo, no lo confirmo. Si querés empezar de nuevo escribí *menú*.']}
    return['Respondé *SI* para confirmar o *cancelar*.'];
  }
  wa.step='inicio';return bot(txt);
}
function waSend(txt){
  if(!txt.trim()||typing)return;
  S.wa.msgs.push({from:'user',t:txt,ts:Date.now()});typing=true;save();render();
  setTimeout(()=>{
    const r=bot(txt);typing=false;r.forEach(t=>S.wa.msgs.push({from:'bot',t,ts:Date.now()}));save();render();
    const i=$('#wain');if(i)i.focus();
  },700);
}

/* ---------- carrito ---------- */
function addLine(id,mods){
  const k=lineKey(id,mods),ex=C.cart.find(l=>l.key===k);
  const test=C.cart.map(l=>({...l}));if(ex)test.find(l=>l.key===k).cant++;else test.push({key:k,id,mods,cant:1});
  const f=faltante(test);if(f)return toast(`No hay stock suficiente (${f.nombre})`,1);
  C.cart=test;render();
}
function carritoModal(){
  const tot=C.cart.reduce((a,l)=>a+lineInfo(l).precio*l.cant,0),mozo=tab==='tomar'&&!clienteMode;
  if(!C.cart.length)return closeModal();
  const most=mozo&&C.mesa===0;
  modal(`<h2>${mozo?'Pedido':'Tu pedido'} · ${most?'Mostrador':'Mesa '+C.mesa}</h2>${most?'<label>Nombre del cliente (para llamarlo cuando esté listo)<input id="cliente" autocomplete="off"></label>':''}${C.cart.map((l,i)=>{const x=lineInfo(l);return`<div class="row"><span>${l.cant}× ${esc(x.p.nombre)}${x.mods.length?`<small>${esc(x.mods.map(m=>m.nombre).join(' · '))}</small>`:''}</span><span><b>${fmt(x.precio*l.cant)}</b> <button class="small ghost bad" data-a="quitarLinea" data-i="${i}">✕</button></span></div>`}).join('')}
<div class="row big"><b>Total</b><b>${fmt(tot)}</b></div><label>¿Alguna aclaración para la cocina?<textarea id="nota" placeholder="Ej: la milanesa bien cocida"></textarea></label>
<div class="btns"><button class="ghost" data-a="close">Seguir ${mozo?'cargando':'mirando'}</button><button class="primary" data-a="enviarPedido">Enviar a cocina</button></div>`);
}

<div class="btns"><button class="ghost" data-a="close">Cancelar</button><button class="primary" data-a="modsOk">Agregar</button></div>`)}else addLine(p.id,[])},

    i.stock=r3(i.stock+q);i.costo=costo;i.min=pdec(d.min);i.prov=d.prov;
    audit('Compra',`${num(q)} ${i.u} ${i.nombre} · ${(prov(d.prov)||{}).nombre||''}`,q*costo);
    if(d.caja)S.egresos.push({id:uid(),turno:S.turno?S.turno.id:null,concepto:`Compra ${i.nombre} (${(prov(d.prov)||{}).nombre||''})`,monto:Math.round(q*costo),ts:Date.now(),por:yo()});
    save();closeModal();render();toast('Stock actualizado')},
  insumo(d){if(!d.nombre.trim())return;let id=norm(d.nombre).replace(/[^a-z0-9]+/g,'-');if(insumo(id))id+='-'+uid().slice(0,3);
    S.insumos.push({id,nombre:d.nombre.trim(),u:d.u,stock:pdec(d.stock),costo:pnum(d.costo),min:pdec(d.min),prov:d.prov});save();closeModal();render();toast('Insumo creado')}
};
function demoVentas(){
  const L=(id,cant,mods)=>({id,cant,mods:mods||[]});
  const combos=[[L('hamb',2,['st']),L('gaseosa',2)],[L('mila',1,['nap']),L('pinta',2)],[L('pizza',1),L('pinta',3)],[L('cesar',1),L('gaseosa',1)],[L('hamb',1,['xp']),L('papas',1),L('pinta',1)],[L('mila',2),L('gaseosa',2)],[L('pizza',2),L('gaseosa',3)],[L('hamb',3),L('papas',1,['pc']),L('pinta',3)],[L('mila',1),L('cesar',1),L('pinta',2)],[L('pizza',1),L('papas',1),L('gaseosa',2)],[L('hamb',2),L('pinta',2)],[L('mila',1,['hf']),L('gaseosa',1)]];
  const medios=['efectivo','mp','tarjeta','efectivo','transferencia','mp','efectivo','tarjeta','efectivo','mp','efectivo','tarjeta'];
  const clientes=[['Martina','341 555-0111','Bv. Oroño 845'],['Diego','341 555-0112','Mitre 1290'],['Sofía','341 555-0113','Pellegrini 2010'],['Pablo','341 555-0114','Salta 1580']];
  if(!S.turno){S.turno={id:uid(),cajera:'Ana',apertura:S.apertura,inicio:Date.now()-5*3600000}}
  combos.forEach((c,i)=>{
    const w=i%3===2,cl=clientes[(i/3|0)%4];
    const p=crearPedido({origen:w?'whatsapp':'mesa',por:w?'WhatsApp':i%2?'QR':'Mozo',mesa:(i%6)+1,cliente:w?cl[0]:'',tel:w?cl[1]:'',direccion:w?cl[2]:'',lines:c,medio:w?medios[i]:null});
    if(p.error)return;p.ts=Date.now()-(260-i*20)*60000;
    if(w){const x=S.clientes[cl[1]]||{tel:cl[1],pedidos:2,gastado:38000};Object.assign(x,{nombre:cl[0],dir:cl[2],pedidos:x.pedidos+1,gastado:x.gastado+p.total,ult:p.ts,ultItems:c});S.clientes[cl[1]]=x}
    if(i<9){p.estado=w?'enviado':'entregado';
      const desc=i===4?10:0,total=Math.round(p.total*(1-desc/100)),prop=w?0:Math.round(total*(i%2?.1:0));
      const pagos={efectivo:0,mp:0,tarjeta:0,transferencia:0};if(i===6){pagos.efectivo=Math.round((total+prop)/2);pagos.tarjeta=total+prop-pagos.efectivo}else pagos[medios[i]]=total+prop;
      const cb=registrarCobro([p],{nombre:w?'Delivery #'+p.num+' · '+cl[0]:'Mesa '+p.mesa,por:'Cajera',subtotal:p.total,descPct:desc,descuento:p.total-total,propina:prop,total,pagos});cb.ts=p.ts+45*60000;
      if(i===4&&S.turno&&S.turno.cajera==='Ana'){const t=cerrarTurnoCon(calcTurno(S.turno).esperado-500);t.fin=Date.now()-2*3600000;S.turno={id:uid(),cajera:'Cajera',apertura:t.contado,inicio:t.fin}}
    }else p.estado=i===9?'listo':i===10?'preparando':'nuevo';
  });
  [['Juli','listo',[L('hamb',1),L('papas',1)]],['Nico','preparando',[L('pizza',1)]],['Caro','nuevo',[L('mila',1),L('gaseosa',1)]]].forEach(([n,e,l])=>{const p=crearPedido({origen:'mostrador',por:'Cajera',cliente:n,lines:l});if(!p.error){p.estado=e;p.ts=Date.now()-(e==='listo'?18:e==='preparando'?9:2)*60000}});
  const hoy=fechaISO();[['Familia Gómez','21:00',6,7,'Cumpleaños, traen torta'],['Lucas','21:30',2,8,''],['Mariana','22:00',4,null,'Ventana si se puede']].forEach(([n,h,per,m,nota])=>S.reservas.push({id:uid(),nombre:n,tel:'341 555-01'+per+'0',personas:per,fecha:hoy,hora:h,mesa:m,nota,estado:'confirmada',ts:Date.now(),por:'Dueño'}));
  const m3=S.pedidos.find(p=>!p.cobrado&&p.mesa===4&&p.origen==='mesa');if(m3)m3.pideCuenta=true;
  S.llamados.push({id:uid(),mesa:5,ts:Date.now()-3*60000});
  registrarMerma('tomate',.4,'Vencido');registrarMerma('cerveza',1.5,'Se cayó / se rompió');registrarMerma('carne',.18,'Error de cocina');
  S.egresos.push({id:uid(),turno:S.turno?S.turno.id:null,concepto:'Pago verdulería',monto:12000,ts:Date.now()-3600000,por:'Cajera'});audit('Egreso','Pago verdulería',12000);save();
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b,e)});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f||!F[f])return;e.preventDefault();F[f](Object.fromEntries(new FormData(e.target)),e.target)});
document.addEventListener('input',e=>{
  const k=e.target.dataset.cb;if(k&&CB){if(k==='desc')CB.desc=e.target.value;else CB.pagos[k.slice(5)]=e.target.value;$('#cbsum').innerHTML=cbResumen()}
  if(E&&e.target.closest('.mod')&&(e.target.dataset.e||e.target.dataset.er)){readE();const ec=$('#ecost');if(ec)ec.innerHTML=eCosto()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.eqrol){const p=S.equipo.find(x=>x.id===t.dataset.eqrol);if(p){if(p.rol==='dueno'&&t.value!=='dueno'&&S.equipo.filter(x=>x.rol==='dueno').length<2){toast('Tiene que quedar al menos un dueño',1);return render()}p.rol=t.value;audit('Equipo',`${p.nombre} pasó a ${ROLES[t.value].nombre}`);save();render()}return}
  if(t.dataset.resmesa){const r=S.reservas.find(x=>x.id===t.dataset.resmesa);if(r){const m=t.value?+t.value:null;if(m&&choque(r.fecha,r.hora,m,r.id)){toast(`La mesa ${m} ya tiene otra reserva cerca de esa hora`,1);return render()}r.mesa=m;save();render()}return}
  if(t.dataset.precio){const p=plato(t.dataset.precio),v=pnum(t.value);if(v>0&&v!==p.precio){audit('Cambio de precio',`${p.nombre}: ${fmt(p.precio)} → ${fmt(v)}`);p.precio=v;save();toast('Precio actualizado')}render();return}
  if(t.dataset.activo){const p=plato(t.dataset.activo);p.activo=t.checked;save();render();return}
  if(E&&t.closest('.mod')){readE();const ec=$('#ecost');if(ec)ec.innerHTML=eCosto();return}
  const k=t.dataset.set;if(!k)return;const v=t.value;
  if(k==='mesaSim'){C.mesa=+v;C.cart=[]}
  else if(k==='mesas')S.mesas=Math.max(1,Math.min(60,parseInt(v)||1));
  else if(k==='envio')S.envio=Math.max(0,pnum(v));
  else if(k==='descMax')S.descMax=Math.max(0,Math.min(100,pdec(v)));
  else if(k==='rFecha'){rFecha=v||fechaISO();return render()}
  else if(k==='autoprint'){ls('taca-autoprint',v);if(v!=='off')marcarImpresos();toast(v==='off'?'Impresión automática apagada':'Impresión automática encendida en este equipo');return render()}
  else if(k==='waTel'){S.wa.tel=v.trim()||S.wa.tel;S.wa.step='inicio';S.wa.draft={}}
  else S[k]=v.trim();
  save();render();
});
function route(){pantallaMode=location.hash==='#pantalla';const m=location.hash.match(/^#mesa-(\d+)$/);clienteMode=m?+m[1]:null;if(clienteMode&&C.mesa!==clienteMode){C.mesa=clienteMode;C.cart=[]}render();if(cloudClient())cargarCarta()}
window.addEventListener('hashchange',route);
window.addEventListener('storage',e=>{if(NB||e.key!==K||!e.newValue)return;try{S=JSON.parse(e.newValue)}catch(x){return}renderSafe()});
setInterval(()=>{if(!busy()&&!$('#modal').innerHTML&&(pantallaMode||((tab==='cocina'||tab==='salon')&&!clienteMode)))render()},pantallaMode?5000:30000);
route();
arrancarCuentas();
if(cloudClient()){NB.escuchar(CLID,()=>cargarCarta());setInterval(cargarCarta,5000)}
