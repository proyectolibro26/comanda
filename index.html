<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comanda — pedidos por QR y WhatsApp para bares y restaurantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f2ea;--ink:#1f1d1a;--muted:#6f6b62;--card:#fff;--line:#e7e1d4;--acc:#c2410c;--acc2:#fff1e8;--ok:#2f7d4a;--okbg:#e7f4ea;--warn:#b45309;--warnbg:#fff4dc;--bad:#b42318;--badbg:#fdecea;--wa:#1fa855;--wabg:#efeae2;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:17px;margin-bottom:12px}
small{color:var(--muted);display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px}
button:hover{border-color:#cfc6b4}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:13px}
button.bad{color:var(--bad)}
button.link{border:0;padding:0;background:none;color:var(--acc);text-decoration:underline;font-size:13px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label input,label select{margin-top:4px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.row+.row{border-top:1px dashed var(--line)}
.row.big{font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#f0ece3;color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ok{background:var(--okbg);color:var(--ok)}
.st-nuevo{background:#e8eefc;color:#2848a8}.st-preparando{background:var(--warnbg);color:var(--warn)}.st-listo,.st-entregado,.st-enviado{background:var(--okbg);color:var(--ok)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f1ede4;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.low td{background:#fff8ef}
tfoot td{font-weight:700;border-bottom:0}
.tablewrap{overflow-x:auto}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--ink);color:#fff}
.top small{color:#bdb6a8}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font:22px "DM Serif Display",serif}
.logo.big{width:56px;height:56px;font-size:34px;border-radius:14px;margin:0 auto 10px}
.who{display:flex;gap:8px;align-items:center}
.who .ghost{color:#fff;border-color:#4a463f}
nav{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;white-space:nowrap;border-radius:9px;color:var(--muted);font-weight:500}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:700}
nav .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.ptitle{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ptitle h1{font:28px "DM Serif Display",serif}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:360px;text-align:center;padding:28px}
.login h1{font:32px "DM Serif Display",serif;margin-bottom:4px}
.login form{display:grid;gap:10px;margin:18px 0 10px}
.hint{font-size:13px;color:var(--muted);background:#f7f4ee;border-radius:10px;padding:8px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.hi{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.hi small{color:#bdb6a8}
.kpi.acc{border-color:var(--acc);background:var(--acc2)}
/* cocina */
.col h2{display:flex;justify-content:space-between}
.ticket{background:#fff;border:1px solid var(--line);border-left:5px solid #2848a8;border-radius:12px;padding:12px;margin-bottom:10px}
.ticket.whatsapp{border-left-color:var(--wa)}
.ticket .th{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ticket .th b{font-size:18px}
.ticket .time{margin-left:auto;font-size:12px;color:var(--muted)}
.ticket ul{margin:0 0 8px;padding-left:18px}
.ticket .nota{background:var(--warnbg);border-radius:8px;padding:5px 8px;margin:0 0 8px;font-size:13px}
.ticket .dir{font-size:13px;margin:0 0 8px;color:var(--muted)}
.ticket button{width:100%}
.empty{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
/* caja */
.grp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grp.alerta{border-color:var(--warn);background:#fffaf0}
.grp .row{padding:0}
.saldo{border-color:var(--ink)}
.lock{display:flex;gap:12px;align-items:center;background:#f7f4ee;font-size:22px}
.lock b{font-size:15px}.lock small{font-size:14px}
.ok{color:var(--ok)}.badt{color:var(--bad)}
/* cliente */
.cli{max-width:520px;margin:0 auto}
.cli.full{padding:0 0 30px}
.cli-h{display:flex;justify-content:space-between;align-items:center;padding:22px 18px;background:var(--ink);color:#fff;border-radius:0 0 22px 22px;margin-bottom:12px}
.cli:not(.full) .cli-h{border-radius:var(--r)}
.cli-h small{color:#bdb6a8}
.cli-h h1{font:26px "DM Serif Display",serif}
.mesa{background:var(--acc);padding:6px 12px;border-radius:99px;font-weight:700}
.cli .cat{font:20px "DM Serif Display",serif;margin:18px 16px 8px}
.dish{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 12px 8px}
.dish.off{opacity:.55}
.dish .price{font-weight:700;color:var(--acc)}
.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty button{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;font-weight:700}
.qty button[data-a=mas]{background:var(--acc);color:#fff;border-color:var(--acc)}
.mis{margin:0 12px 12px}
.mis h3{margin-bottom:6px}
button.mp{background:#009ee3;color:#fff;border-color:#009ee3;font-weight:700}
.cartbar{position:sticky;bottom:12px;margin:14px 12px 0;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.staff{text-align:center;font-size:13px;margin-top:30px}.staff a{color:var(--muted)}
/* whatsapp */
.wa-wrap{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.wa-wrap{grid-template-columns:1fr}}
.phone{border-radius:24px;overflow:hidden;border:8px solid #1f1d1a;background:var(--wabg);display:flex;flex-direction:column;height:640px}
.wa-h{background:#075e54;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 12px}
.wa-h small{color:#cde7e2}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.wa-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:7px 10px 4px;border-radius:10px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:normal}
.msg small{text-align:right;font-size:10px}
.msg.user{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
.msg.bot{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.msg.sys{align-self:center;background:#fff3c4;font-size:12px;text-align:center}
.wachips{display:flex;gap:5px;overflow-x:auto;padding:6px 8px;background:#f0f0f0}
.wachips button{font-size:12px;padding:4px 9px;border-radius:99px;white-space:nowrap}
.wa-in{display:flex;gap:6px;padding:8px;background:#f0f0f0}
.wa-in input{border-radius:99px}
.wa-in button{border-radius:50%;width:42px;background:var(--wa);color:#fff;border-color:var(--wa)}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
/* qr */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.qr{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff}
.qr b{display:block;font:18px "DM Serif Display",serif;margin-bottom:8px}
.qrc{display:flex;justify-content:center;margin-bottom:8px;min-height:120px;align-items:center;font-size:12px;color:var(--muted)}
.qrc img,.qrc canvas{width:120px;height:120px}
.qr small{margin-bottom:6px}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(20,18,15,.5);display:grid;place-items:center;padding:16px;z-index:20}
.mod{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.mod h2{font:22px "DM Serif Display",serif}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;display:grid;gap:6px}
.t{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.t.err{background:var(--bad)}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline label{flex:1;min-width:120px;margin:0}
details summary{cursor:pointer}
details ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.alerts .chip{margin:0 6px 6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const K='comanda-demo-v1';
const ROLES={
  dueno:{pin:'1234',nombre:'Dueño',tabs:['cierre','caja','cocina','stock','whatsapp','mesas','menu']},
  cajera:{pin:'0000',nombre:'Cajera',tabs:['caja','cocina','whatsapp','menu']},
  cocina:{pin:'1111',nombre:'Cocina',tabs:['cocina','stock']}
};
const TABS={cierre:'📊 Cierre del día',caja:'💵 Caja',cocina:'👨‍🍳 Cocina',stock:'📦 Stock y merma',whatsapp:'💬 WhatsApp',mesas:'🔳 QR y ajustes',menu:'📱 Vista cliente'};
const ESTADO={nuevo:'Recibido',preparando:'En preparación',listo:'Listo',entregado:'Entregado',enviado:'En camino'};
const MEDIO={efectivo:'💵 Efectivo',mp:'Mercado Pago',tarjeta:'💳 Tarjeta',transferencia:'🏦 Transferencia'};

function hoy(){return new Date().toLocaleDateString('es-AR')}
function seed(){return{
  negocio:'La Esquina Bar',mesas:12,envio:1500,apertura:20000,nextNum:1,dia:hoy(),baseUrl:'',
  insumos:[
    {id:'pan',nombre:'Pan de hamburguesa',u:'u',stock:60,costo:250,min:15},
    {id:'carne',nombre:'Carne picada',u:'kg',stock:8,costo:9000,min:2},
    {id:'cheddar',nombre:'Queso cheddar',u:'kg',stock:3,costo:12000,min:.5},
    {id:'nalga',nombre:'Nalga (milanesa)',u:'kg',stock:6,costo:11000,min:1.5},
    {id:'rallado',nombre:'Pan rallado',u:'kg',stock:4,costo:2000,min:1},
    {id:'huevo',nombre:'Huevos',u:'u',stock:60,costo:200,min:12},
    {id:'papa',nombre:'Papa',u:'kg',stock:20,costo:1200,min:5},
    {id:'aceite',nombre:'Aceite',u:'l',stock:10,costo:2500,min:3},
    {id:'lechuga',nombre:'Lechuga',u:'kg',stock:3,costo:2500,min:.5},
    {id:'tomate',nombre:'Tomate',u:'kg',stock:4,costo:2800,min:1},
    {id:'pollo',nombre:'Pechuga de pollo',u:'kg',stock:5,costo:6000,min:1},
    {id:'harina',nombre:'Masa de pizza',u:'kg',stock:10,costo:1000,min:2},
    {id:'muzza',nombre:'Muzzarella',u:'kg',stock:5,costo:9500,min:1},
    {id:'salsa',nombre:'Salsa de tomate',u:'l',stock:5,costo:3000,min:1},
    {id:'gaseosa',nombre:'Gaseosa 500 ml',u:'u',stock:48,costo:900,min:12},
    {id:'cerveza',nombre:'Cerveza tirada',u:'l',stock:50,costo:3000,min:10}
  ],
  platos:[
    {id:'hamb',nombre:'Hamburguesa completa',cat:'Platos',precio:9500,desc:'Carne, cheddar, lechuga, tomate y papas',alias:['hambur','burger'],receta:{pan:1,carne:.18,cheddar:.04,lechuga:.02,tomate:.03,papa:.25,aceite:.05}},
    {id:'mila',nombre:'Milanesa con papas',cat:'Platos',precio:11000,desc:'Milanesa de nalga con papas fritas',alias:['mila'],receta:{nalga:.22,rallado:.06,huevo:1,papa:.3,aceite:.08}},
    {id:'pizza',nombre:'Pizza muzzarella',cat:'Platos',precio:10500,desc:'Grande, 8 porciones',alias:['pizza','muzza'],receta:{harina:.3,muzza:.25,salsa:.12}},
    {id:'cesar',nombre:'Ensalada César con pollo',cat:'Platos',precio:8500,desc:'Pollo grillado, lechuga y croutons',alias:['ensalada','cesar'],receta:{pollo:.15,lechuga:.12,cheddar:.02,rallado:.02}},
    {id:'gaseosa',nombre:'Gaseosa 500 ml',cat:'Bebidas',precio:2500,desc:'Cola, lima-limón o naranja',alias:['gaseosa','coca','sprite','fanta','bebida'],receta:{gaseosa:1}},
    {id:'pinta',nombre:'Pinta de cerveza',cat:'Bebidas',precio:4500,desc:'Rubia o roja, 500 ml',alias:['cerveza','pinta','birra'],receta:{cerveza:.5}},
    {id:'papas',nombre:'Papas fritas',cat:'Para picar',precio:5000,desc:'Porción grande',alias:['papa','frita'],receta:{papa:.4,aceite:.08}}
  ],
  pedidos:[],mermas:[],egresos:[],arqueo:null,cierres:[],
  wa:{msgs:[],step:'inicio',draft:{},ultimo:null}
}}

let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.insumos)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let rol=null;try{rol=sessionStorage.getItem('comanda-rol')}catch(e){}
let tab=null,clienteMode=null,typing=false;
const C={mesa:1,cart:{}};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const fmt=n=>(n<0?'−$':'$')+Math.round(Math.abs(n)).toLocaleString('es-AR');
const num=n=>(+n).toLocaleString('es-AR',{maximumFractionDigits:3});
const r3=x=>Math.round(x*1000)/1000;
const pnum=x=>parseFloat(String(x).replace(',','.'));
const hm=ts=>new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const hace=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?'recién':'hace '+m+' min'};
const uid=()=>Math.random().toString(36).slice(2,9);
const plato=id=>S.platos.find(p=>p.id===id);
const insumo=id=>S.insumos.find(i=>i.id===id);
const disp=p=>Math.max(0,Math.floor(Math.min(...Object.entries(p.receta).map(([i,c])=>insumo(i).stock/c))+1e-6));
const costoReceta=p=>Object.entries(p.receta).reduce((a,[i,c])=>a+c*insumo(i).costo,0);
function toast(t,err){const d=document.createElement('div');d.className='t'+(err?' err':'');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(html){$('#modal').innerHTML=`<div class="ov" data-a="closeOv"><div class="mod">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}

/* ---------- lógica del negocio ---------- */
function crearPedido(o){
  const need={};
  for(const it of o.items){const p=plato(it.id);for(const [ins,c] of Object.entries(p.receta))need[ins]=r3((need[ins]||0)+c*it.cant)}
  for(const [ins,c] of Object.entries(need)){const i=insumo(ins);if(i.stock<c-1e-9)return{error:`No alcanza el stock de ${i.nombre} (hay ${num(i.stock)} ${i.u}, se necesitan ${num(c)} ${i.u})`}}
  for(const [ins,c] of Object.entries(need)){const i=insumo(ins);i.stock=r3(i.stock-c)}
  const items=o.items.map(it=>{const p=plato(it.id);return{id:p.id,nombre:p.nombre,precio:p.precio,cant:it.cant}});
  const subtotal=items.reduce((a,i)=>a+i.precio*i.cant,0),envio=o.origen==='whatsapp'?S.envio:0;
  const ped={id:uid(),num:S.nextNum++,ts:Date.now(),origen:o.origen,mesa:o.mesa||null,cliente:o.cliente||'',direccion:o.direccion||'',items,subtotal,envio,total:subtotal+envio,estado:'nuevo',medio:o.medio||null,cobrado:false,pideCuenta:false,consumo:need,anulado:false,nota:o.nota||''};
  S.pedidos.push(ped);save();return ped;
}
function anular(p){if(p.anulado)return;for(const [ins,c] of Object.entries(p.consumo)){const i=insumo(ins);i.stock=r3(i.stock+c)}p.anulado=true}
function siguiente(p){return{nuevo:'preparando',preparando:'listo',listo:p.origen==='mesa'?'entregado':'enviado'}[p.estado]}
function avanzar(p){
  p.estado=siguiente(p);
  if(p.origen==='whatsapp'){
    const t={preparando:`👨‍🍳 Tu pedido *#${p.num}* ya está en preparación.`,listo:`✅ Tu pedido *#${p.num}* está listo, lo estamos por despachar.`,enviado:`🛵 ¡Tu pedido *#${p.num}* salió para ${p.direccion}! Total a pagar: *${fmt(p.total)}*.`}[p.estado];
    if(t)S.wa.msgs.push({from:'bot',t,ts:Date.now()});
  }
  save();
}
function registrarMerma(ins,cant,motivo){
  const i=insumo(ins);if(!(cant>0))return 'Cantidad inválida';if(cant>i.stock+1e-9)return 'La merma supera el stock disponible';
  i.stock=r3(i.stock-cant);S.mermas.push({id:uid(),ins,cant,motivo,valor:cant*i.costo,ts:Date.now(),por:rol?ROLES[rol].nombre:''});save();
}
function grupos(){
  const g={};
  S.pedidos.filter(p=>!p.anulado&&!p.cobrado).forEach(p=>{
    const k=p.origen==='mesa'?'m'+p.mesa:'w'+p.num;
    g[k]=g[k]||{key:k,nombre:p.origen==='mesa'?'Mesa '+p.mesa:'🛵 Delivery #'+p.num+' · '+p.cliente,peds:[],total:0,cuenta:false,medioDecl:null};
    g[k].peds.push(p);g[k].total+=p.total;if(p.pideCuenta)g[k].cuenta=true;if(p.medio)g[k].medioDecl=p.medio;
  });
  return Object.values(g).sort((a,b)=>b.cuenta-a.cuenta);
}
function pedidosDeGrupo(k){return S.pedidos.filter(p=>!p.anulado&&!p.cobrado&&(k[0]==='m'?p.origen==='mesa'&&p.mesa==k.slice(1):p.origen==='whatsapp'&&p.num==k.slice(1)))}
function cobrar(peds,medio){peds.forEach(p=>{p.cobrado=true;p.medio=medio;p.tsCobro=Date.now();p.pideCuenta=false});save()}
function calc(){
  const v=S.pedidos.filter(p=>!p.anulado),cob=v.filter(p=>p.cobrado);
  const porMedio={efectivo:0,mp:0,tarjeta:0,transferencia:0};cob.forEach(p=>porMedio[p.medio]+=p.total);
  const porOrigen={mesa:0,whatsapp:0};v.forEach(p=>porOrigen[p.origen]+=p.total);
  const ventas=v.reduce((a,p)=>a+p.total,0),pendiente=v.filter(p=>!p.cobrado).reduce((a,p)=>a+p.total,0);
  const egresos=S.egresos.reduce((a,e)=>a+e.monto,0),saldo=S.apertura+porMedio.efectivo-egresos;
  const consumo={};v.forEach(p=>Object.entries(p.consumo).forEach(([i,c])=>consumo[i]=r3((consumo[i]||0)+c)));
  const costoVendido=Object.entries(consumo).reduce((a,[i,c])=>a+c*insumo(i).costo,0);
  const merma={};S.mermas.forEach(m=>{merma[m.ins]=merma[m.ins]||{cant:0,valor:0};merma[m.ins].cant=r3(merma[m.ins].cant+m.cant);merma[m.ins].valor+=m.valor});
  const costoMerma=S.mermas.reduce((a,m)=>a+m.valor,0),stockValor=S.insumos.reduce((a,i)=>a+i.stock*i.costo,0);
  const platos={};v.forEach(p=>p.items.forEach(i=>platos[i.nombre]=(platos[i.nombre]||0)+i.cant));
  return{v,cob,porMedio,porOrigen,ventas,pendiente,egresos,saldo,consumo,costoVendido,merma,costoMerma,stockValor,platos,
    bajos:S.insumos.filter(i=>i.stock<=i.min),tickets:v.length,ganancia:ventas-costoVendido-costoMerma};
}

function busy(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='wain'}

/* ---------- asistente de WhatsApp ---------- */
const NUMS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
function parsear(t){
  const out={};
  norm(t).split(/,|\by\b|\be\b|\n|\+|;/).forEach(seg=>{
    seg=seg.trim();if(!seg)return;
    const p=S.platos.find(p=>p.alias.some(a=>seg.includes(a)));if(!p)return;
    let q=1;const m=seg.match(/(\d+)/);
    if(m)q=+m[1];else{for(const w in NUMS)if(new RegExp('\\b'+w+'\\b').test(seg)){q=NUMS[w];break}}
    out[p.id]=(out[p.id]||0)+q;
  });
  return Object.entries(out).map(([id,cant])=>({id,cant}));
}
function cartaTxt(){const cats=[...new Set(S.platos.map(p=>p.cat))];return'📋 *Nuestra carta*\n'+cats.map(c=>`\n*${c}*\n`+S.platos.filter(p=>p.cat===c).map(p=>`• ${p.nombre} — ${fmt(p.precio)}${disp(p)<=0?' (agotado)':''}`).join('\n')).join('\n')+`\n\n🛵 Envío: ${fmt(S.envio)}`}
function resumenItems(items){const sub=items.reduce((a,i)=>a+plato(i.id).precio*i.cant,0);return items.map(i=>`• ${i.cant}× ${plato(i.id).nombre} — ${fmt(plato(i.id).precio*i.cant)}`).join('\n')+`\n• Envío — ${fmt(S.envio)}\n*Total: ${fmt(sub+S.envio)}*`}
function pasoResumen(items){
  const agot=items.filter(i=>disp(plato(i.id))<i.cant);
  if(agot.length){S.wa.step='pedido';return[`Uy, de ${agot.map(i=>plato(i.id).nombre).join(' y ')} no nos queda suficiente hoy 😕 (${agot.map(i=>'quedan '+disp(plato(i.id))).join(', ')}). ¿Querés cambiar algo?`]}
  S.wa.draft={items};S.wa.step='datos';
  return['Perfecto, te anoto:\n'+resumenItems(items),'¿A nombre de quién y a qué dirección lo mandamos? (por ejemplo: *Juan, San Martín 1234*)'];
}
function bot(txt){
  const t=norm(txt),wa=S.wa;
  if(/\bcancel/.test(t)){wa.step='inicio';wa.draft={};return['Listo, cancelé el pedido. Cuando quieras escribí *menú* para empezar de nuevo.']}
  if(/^estado\b|como va mi pedido|donde esta mi pedido/.test(t)){const p=S.pedidos.find(p=>p.id===wa.ultimo);return[p?`Tu pedido *#${p.num}* está: *${ESTADO[p.estado]}*${p.anulado?' (anulado)':''}.`:'Todavía no tenés pedidos hechos. Escribí *menú* para ver la carta.']}
  if(/^(menu|carta)\b/.test(t)){wa.step='pedido';return[cartaTxt(),'Escribí lo que querés, por ejemplo: *2 hamburguesas y 1 coca*']}
  if(wa.step==='inicio'||(wa.step==='pedido'&&/^(hola|buenas|buen dia)/.test(t))){
    const it=parsear(t);if(it.length)return pasoResumen(it);
    wa.step='pedido';return[`¡Hola! 👋 Soy el asistente de *${S.negocio}*. Te tomo el pedido para delivery.`,cartaTxt(),'Escribí lo que querés, por ejemplo: *2 hamburguesas y 1 coca*'];
  }
  if(wa.step==='pedido'){const it=parsear(t);if(!it.length)return['No te entendí 🙈. Decime qué querés de la carta, por ejemplo: *1 pizza y 2 cervezas*. O escribí *menú* para verla.'];return pasoResumen(it)}
  if(wa.step==='datos'){
    if(t.length<5)return['Pasame nombre y dirección completa, por favor 🙏'];
    const i=txt.indexOf(',');wa.draft.cliente=i>0?txt.slice(0,i).trim():'Cliente';wa.draft.direccion=i>0?txt.slice(i+1).trim():txt.trim();
    wa.step='pago';return[`Genial, ${wa.draft.cliente}. ¿Cómo vas a pagar?\n1️⃣ Efectivo\n2️⃣ Transferencia\n3️⃣ Mercado Pago`];
  }
  if(wa.step==='pago'){
    const m=/^1|efect/.test(t)?'efectivo':/^2|transf/.test(t)?'transferencia':/^3|mercado|^mp/.test(t)?'mp':null;
    if(!m)return['Respondé *1*, *2* o *3* para elegir la forma de pago.'];
    wa.draft.medio=m;wa.step='confirmar';
    return[`📝 *Resumen del pedido*\n${resumenItems(wa.draft.items)}\n📍 ${wa.draft.direccion}\n💳 ${MEDIO[m]}${m==='transferencia'?'\nAlias: LAESQUINA.BAR':''}${m==='mp'?'\nTe mandamos el link de pago al confirmar.':''}\n\nRespondé *SI* para confirmar o *cancelar*.`];
  }
  if(wa.step==='confirmar'){
    if(/^(si|dale|ok|confirmo|de una)/.test(t)){
      const d=wa.draft,r=crearPedido({origen:'whatsapp',cliente:d.cliente,direccion:d.direccion,items:d.items,medio:d.medio});
      if(r.error){wa.step='pedido';return['Uy, justo se nos acabó algo: '+r.error+'. ¿Querés pedir otra cosa?']}
      wa.ultimo=r.id;wa.step='inicio';wa.draft={};
      return[`✅ ¡Pedido *#${r.num}* confirmado y enviado a la cocina!\nDemora estimada: 35 a 45 min.\nEscribí *estado* cuando quieras saber cómo va.`];
    }
    if(/^no\b/.test(t)){wa.step='inicio';wa.draft={};return['Listo, no lo confirmo. Si querés empezar de nuevo escribí *menú*.']}
    return['Respondé *SI* para confirmar o *cancelar*.'];
  }
  wa.step='inicio';return bot(txt);
}
function waSend(txt){
  if(!txt.trim()||typing)return;
  S.wa.msgs.push({from:'user',t:txt,ts:Date.now()});typing=true;save();render();
  setTimeout(()=>{
    const r=bot(txt);typing=false;r.forEach(t=>S.wa.msgs.push({from:'bot',t,ts:Date.now()}));save();render();
    const i=$('#wain');if(i)i.focus();
  },700);
}

    try{navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado ✓ — pegalo en WhatsApp'),show)}catch(e){show()}},

    S.pedidos=S.pedidos.filter(p=>!p.anulado&&!p.cobrado);S.mermas=[];S.egresos=[];S.arqueo=null;S.apertura=20000;S.dia=hoy();save();closeModal();render();toast('Día cerrado ✓')},

  login(d){if(ROLES[d.rol]&&ROLES[d.rol].pin===d.pin){rol=d.rol;try{sessionStorage.setItem('comanda-rol',rol)}catch(e){}tab=null;render()}else toast('PIN incorrecto',1)},
  wa(d,f){const t=d.t;f.reset();waSend(t)},

  egreso(d){const m=pnum(d.monto);if(!(m>0))return toast('Monto inválido',1);S.egresos.push({concepto:d.concepto,monto:m,ts:Date.now(),por:ROLES[rol].nombre});save();render();toast('Egreso registrado')},
  merma(d){const e=registrarMerma(d.ins,pnum(d.cant),d.motivo);if(e)return toast(e,1);render();toast('Merma registrada')},
  apertura(d){const m=pnum(d.monto);if(!(m>=0))return toast('Monto inválido',1);S.apertura=m;save();closeModal();render()},
  ingreso(d){const i=insumo(d.id),q=pnum(d.cant);if(!(q>0))return toast('Cantidad inválida',1);i.stock=r3(i.stock+q);if(pnum(d.costo)>0)i.costo=pnum(d.costo);if(pnum(d.min)>=0)i.min=pnum(d.min);save();closeModal();render();toast('Stock actualizado')}
};
function demoVentas(){
  const combos=[[['hamb',2],['gaseosa',2]],[['mila',1],['pinta',2]],[['pizza',1],['pinta',3]],[['cesar',1],['gaseosa',1]],[['hamb',1],['papas',1],['pinta',1]],[['mila',2],['gaseosa',2]],[['pizza',2],['gaseosa',3]],[['hamb',3],['papas',1],['pinta',3]],[['mila',1],['cesar',1],['pinta',2]],[['pizza',1],['papas',1],['gaseosa',2]]];
  const medios=['efectivo','mp','tarjeta','efectivo','transferencia','mp','efectivo','tarjeta','efectivo','mp'];
  const nombres=['Martina','Diego','Sofía','Pablo'];
  combos.forEach((c,i)=>{
    const w=i%3===2,p=crearPedido({origen:w?'whatsapp':'mesa',mesa:(i%6)+1,cliente:w?nombres[i%4]:'',direccion:w?'Bv. Oroño '+(800+i*45):'',items:c.map(([id,cant])=>({id,cant})),medio:w?medios[i]:null});
    if(p.error)return;p.ts=Date.now()-(150-i*14)*60000;
    if(i<8){p.estado=w?'enviado':'entregado';p.cobrado=true;p.medio=medios[i];p.tsCobro=p.ts+40*60000}else p.estado=i===8?'preparando':'nuevo';
  });
  registrarMerma('tomate',.4,'Vencido');registrarMerma('cerveza',1.5,'Se cayó / se rompió');registrarMerma('carne',.18,'Error de cocina');
  S.egresos.push({concepto:'Pago verdulería',monto:12000,ts:Date.now()-3600000,por:'Cajera'});save();
}

});
