<script>
'use strict';
const NUBE={url:'https://ktoicklowsblqmerqqdo.supabase.co',key:'sb_publishable_h_306P5TZJWcBUHXiZgo-A_P_rKMqjk'};
const ESTADOS=['Sin contactar','Mensaje enviado','Respondió','Demo agendada','Demo hecha','En prueba','Pagó','No le interesa'];
const HITOS={1:'contacto',4:'demo',5:'prueba',6:'venta'};
const MET=[['contactos','Contactos'],['demos','Demos'],['pruebas','Pruebas'],['ventas','Ventas']];
const TIPO_MET={contacto:'contactos',demo:'demos',prueba:'pruebas',venta:'ventas'};
const MSG_WA=n=>`Hola, ¿cómo andan? Soy de ta-ca, de Rosario. Hicimos un sistema para bares: el cliente pide y paga desde el QR de la mesa, el pedido sale solo en cocina y el plato se apaga cuando se termina el stock. Le sacás una foto a tu carta y en un minuto lo tenés armado. ¿Te puedo pasar 10 minutos esta semana a mostrártelo en el celular, antes del servicio?`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(+n||0).toLocaleString('es-AR');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hoyAR=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const mesAR=d=>new Date((d?new Date(d).getTime():Date.now())-3*3600e3).toISOString().slice(0,7);
const nombreMes=m=>{const[a,b]=m.split('-');return new Date(+a,+b-1,15).toLocaleDateString('es-AR',{month:'long',year:'numeric'})};
const sumarMes=(m,k)=>{const[a,b]=m.split('-').map(Number);const d=new Date(a,b-1+k,15);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
// Cita en el calendario: link de Google Calendar y archivo .ics (iPhone / Outlook). Hora de Argentina.
const citaTxt=c=>'Demo ta-ca · '+c.nombre;
const citaDet=c=>[c.proximo,c.telefono?'Tel: '+c.telefono:'',c.whatsapp?'WhatsApp: https://wa.me/'+c.whatsapp:'',c.notas?'Notas: '+c.notas:'',c.maps?'Mapa: '+c.maps:'','Ficha: '+location.origin+'/equipo/'].filter(Boolean).join('\n');
const citaLugar=c=>[c.direccion,c.zona,'Rosario'].filter(Boolean).join(', ');
function citaRango(c){const f=c.fecha.replace(/-/g,'');if(!c.hora){const d=new Date(c.fecha+'T12:00:00');d.setDate(d.getDate()+1);return{dia:1,a:f,b:d.toISOString().slice(0,10).replace(/-/g,'')}}
  const [h,m]=c.hora.split(':').map(Number),fin=h*60+m+60,p=n=>String(n).padStart(2,'0');
  return{a:f+'T'+p(h)+p(m)+'00',b:f+'T'+p(Math.min(23,Math.floor(fin/60)))+p(fin>=1440?59:fin%60)+'00'}}
function gcalLink(c){const r=citaRango(c);return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(citaTxt(c))+'&dates='+r.a+'/'+r.b+(r.dia?'':'&ctz=America/Argentina/Buenos_Aires')+'&location='+encodeURIComponent(citaLugar(c))+'&details='+encodeURIComponent(citaDet(c))}
function icsLink(c){const r=citaRango(c),e=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ta-ca//equipo//ES','BEGIN:VEVENT','UID:'+c.id+'-'+r.a+'@ta-ca.com.ar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    r.dia?'DTSTART;VALUE=DATE:'+r.a:'DTSTART;TZID=America/Argentina/Buenos_Aires:'+r.a,r.dia?'DTEND;VALUE=DATE:'+r.b:'DTEND;TZID=America/Argentina/Buenos_Aires:'+r.b,
    'SUMMARY:'+e(citaTxt(c)),'LOCATION:'+e(citaLugar(c)),'DESCRIPTION:'+e(citaDet(c)),'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:'+e(citaTxt(c)),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return'data:text/calendar;charset=utf-8,'+encodeURIComponent(t)}
const botonesCita=c=>c.fecha?`<a class="primary" href="${esc(gcalLink(c))}" target="_blank" rel="noopener">Agregar a Google Calendar</a><a href="${esc(icsLink(c))}" download="cita-${esc(c.id)}.ics">Calendario del iPhone</a>`:'';
const fechaCorta=f=>f?new Date(f+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ICO={
  res:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  con:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>',
  tar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
  obj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  eq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>'
};
const LOGO='<span class="logo" aria-label="ta-ca"><span>ta</span><i aria-hidden="true"><b></b></i><span>ca</span></span>';

let sb=null,SES=null,YO=null,MES=mesAR(),TAB='res',CARG=false;
let D={equipo:[],config:{},contactos:[],actividad:[],tareas:[],objetivos:[],met:null};
let F={q:'',estado:'',zona:'',quien:'todos'};
let LOGIN={modo:'entrar',msg:''};

function toast(t,mal){const el=document.createElement('div');el.className='toast'+(mal?' mal':'');el.textContent=t;el.setAttribute('role','status');document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function modal(h){$('#modal').innerHTML=`<div class="ov" data-ov="1"><div class="mod" role="dialog" aria-modal="true">${h}</div></div>`;const f=$('#modal input,#modal select,#modal textarea');if(f&&!('ontouchstart' in window))f.focus()}
function cerrar(){$('#modal').innerHTML=''}
const miembro=id=>D.equipo.find(x=>x.id===id);
const nombre=id=>id==='todos'?'Todo el equipo':(miembro(id)||{}).nombre||id||'Sin asignar';
const cfg=()=>Object.assign({precios:{local:49900,encendido:89900},fijos:168020,porLocal:3886,fondoPct:20},D.config||{});

/* ---------- datos ---------- */
async function cargar(){
  CARG=true;
  const q=(t,o)=>sb.from(t).select('*').order(o||'id',{ascending:true});
  const [eq,cf,ct,ac,ta,ob,mt]=await Promise.all([q('taca_vt_equipo','creado'),sb.from('taca_vt_config').select('*').eq('id',1).maybeSingle(),q('taca_vt_contactos','nro').limit(2000),
    sb.from('taca_vt_actividad').select('*').gte('ts',new Date(Date.now()-400*864e5).toISOString()).order('ts',{ascending:false}).limit(5000),q('taca_vt_tareas','creado'),q('taca_vt_objetivos','mes'),sb.rpc('taca_vt_metricas',{p_mes:MES})]);
  const err=[eq,cf,ct,ac,ta,ob].find(r=>r.error);if(err)throw err.error;
  D={equipo:eq.data||[],config:(cf.data&&cf.data.data)||{},contactos:ct.data||[],actividad:ac.data||[],tareas:ta.data||[],objetivos:ob.data||[],met:mt.data||null};
  CARG=false;
}
async function recargarMet(){const r=await sb.rpc('taca_vt_metricas',{p_mes:MES});D.met=r.data||null}

/* ---------- cálculos ---------- */
function actMes(m){return D.actividad.filter(a=>mesAR(a.ts)===m)}
function logros(m,quien){const o={contactos:0,demos:0,pruebas:0,ventas:0};actMes(m).forEach(a=>{if(quien&&a.miembro!==quien)return;const k=TIPO_MET[a.tipo];if(k)o[k]++});return o}
function objetivo(m,quien){return D.objetivos.find(o=>o.mes===m&&o.miembro===quien)||{contactos:0,demos:0,pruebas:0,ventas:0}}
function plata(m){
  const c=cfg(),met=D.met||{},pag=+met.pagando||0,mrr=+met.mrr||0;
  const gastos=(+c.fijos||0)+pag*(+c.porLocal||0);
  const com={};D.equipo.forEach(e=>com[e.id]=0);
  actMes(m).filter(a=>a.tipo==='venta').forEach(a=>{com[a.miembro]=(com[a.miembro]||0)+(+a.monto||0)});
  const comTot=Object.values(com).reduce((s,v)=>s+v,0);
  const resultado=mrr-gastos-comTot;
  const fondo=resultado>0?resultado*(+c.fondoPct||0)/100:0;
  const reparto=resultado>0?resultado-fondo:0;
  const filas=D.equipo.filter(e=>e.activo).map(e=>{const parte=e.rol==='socio'?reparto*(+e.parte||0)/100:0;return{e,com:com[e.id]||0,parte,total:(com[e.id]||0)+parte}});
  const ticket=(c.precios.local*0.6+c.precios.encendido*0.4);
  return{mrr,cobrado:+met.cobrado_mes||0,pag,gastos,comTot,resultado,fondo,reparto,filas,ticket};
}

/* ---------- vistas ---------- */
function vLogin(){
  const m=LOGIN.modo;
  return`<div class="login"><div style="display:flex;justify-content:center;margin-bottom:18px">${LOGO}</div><form class="card" data-f="${m}">
<h2>${m==='crear'?'Crear mi cuenta':m==='olvido'?'Recuperar contraseña':m==='nueva'?'Elegí tu contraseña nueva':'Equipo de ventas'}</h2>
<p class="muted" style="margin:0">${m==='crear'?'Usá tu mail. Después Lucas te da acceso al equipo.':m==='olvido'?'Te mandamos un mail con un link para elegir otra.':m==='nueva'?'Mínimo 8 caracteres.':'Entrá con tu mail y tu contraseña.'}</p>
${m!=='nueva'?'<label>Mail<input name="email" type="email" autocomplete="email" value="'+esc(LOGIN.email||'')+'" required></label>':''}
${m!=='olvido'?`<label>Contraseña<input name="pass" type="password" minlength="${m==='entrar'?1:8}" autocomplete="${m==='entrar'?'current-password':'new-password'}" required></label>`:''}
${LOGIN.msg?`<p style="margin:0;color:${LOGIN.mal?'var(--bad)':'var(--ok)'}" role="status">${esc(LOGIN.msg)}</p>`:''}
<button class="primary" type="submit">${m==='crear'?'Crear cuenta':m==='olvido'?'Mandarme el mail':m==='nueva'?'Guardar contraseña':'Entrar'}</button>
${m==='entrar'?'<div style="display:flex;justify-content:space-between;flex-wrap:wrap"><button type="button" class="link" data-a="lmodo" data-m="crear">Crear mi cuenta</button><button type="button" class="link" data-a="lmodo" data-m="olvido">Me olvidé la contraseña</button></div>':m!=='nueva'?'<button type="button" class="link" data-a="lmodo" data-m="entrar">Volver a entrar</button>':''}
</form></div>`}
function vSinAcceso(){return`<div class="login"><div style="display:flex;justify-content:center;margin-bottom:18px">${LOGO}</div><div class="card"><h2>Falta que te den acceso</h2><p class="muted">Tu cuenta <b style="color:var(--tx)">${esc(SES.user.email)}</b> todavía no está en el equipo. Pasale este mail a Lucas para que te sume en la pestaña Equipo.</p><div class="btns"><button data-a="reintentar" class="primary">Ya me sumó</button><button data-a="salir">Salir</button></div></div></div>`}

function nav(){const T=[['res','Resumen',ICO.res],['con','Contactos',ICO.con],['tar','Tareas',ICO.tar],['obj','Objetivos',ICO.obj],['eq','Equipo',ICO.eq]];

<label style="margin-top:10px">Mail con el que se registró<input name="email" type="email" value="${esc(e.email||'')}" placeholder="nombre@mail.com"></label>
<div class="f2" style="margin-top:10px"><label>Rol<select name="rol"><option value="vendedor"${e.rol==='vendedor'?' selected':''}>Vendedor</option><option value="socio"${e.rol==='socio'?' selected':''}>Socio</option></select></label><label>Parte de la ganancia (%)<input name="parte" type="number" min="0" max="100" value="${+e.parte||0}"></label></div>
<label style="margin-top:10px;flex-direction:row;align-items:center;gap:10px"><input type="checkbox" name="activo" style="width:auto" ${e.activo?'checked':''}> Activo</label>
<p class="muted" style="font-size:13px">La contraseña la elige cada uno al crear su cuenta en ta-ca.com.ar/equipo. Nadie más la ve.</p>
<div class="btns"><button type="button" class="ghost" data-a="cerrar">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form>`)}

/* ---------- acciones ---------- */
const A={
  tab(b){TAB=b.dataset.t;render();scrollTo(0,0)},
  async mes(b){MES=sumarMes(MES,+b.dataset.k);await recargarMet();render()},
  lmodo(b){LOGIN={modo:b.dataset.m,msg:''};render()},
  async salir(){await sb.auth.signOut();SES=null;YO=null;LOGIN={modo:'entrar',msg:''};render()},
  async reintentar(){await iniciar()},
  cerrar(){cerrar()},
  verC(b){const c=D.contactos.find(x=>x.id===b.dataset.id);if(c)mContacto(c)},
  nuevoC(){mNuevoC()},nuevaT(){mNuevaT()},nuevoM(){mMiembro()},
  editM(b){mMiembro(miembro(b.dataset.id))},
  async tHecha(b){const t=D.tareas.find(x=>x.id===b.dataset.id);if(!t)return;t.hecho=!t.hecho;render();const r=await sb.from('taca_vt_tareas').update({hecho:t.hecho}).eq('id',t.id);if(r.error){t.hecho=!t.hecho;render();toast('No se pudo guardar',1)}},
  async tBorrar(b){const t=D.tareas.find(x=>x.id===b.dataset.id);if(!t||!confirm('¿Borrar la tarea "'+t.titulo+'"?'))return;const r=await sb.from('taca_vt_tareas').delete().eq('id',t.id);if(r.error)return toast('No se pudo borrar',1);D.tareas=D.tareas.filter(x=>x!==t);render()},
  async guardarObj(){const filas={};document.querySelectorAll('[data-obj]').forEach(i=>{const[m,k]=i.dataset.obj.split(':');(filas[m]=filas[m]||{mes:MES,miembro:m})[k]=Math.max(0,parseInt(i.value,10)||0)});
    const r=await sb.from('taca_vt_objetivos').upsert(Object.values(filas));if(r.error)return toast('No se pudo guardar: '+r.error.message,1);
    Object.values(filas).forEach(f=>{const o=D.objetivos.find(x=>x.mes===f.mes&&x.miembro===f.miembro);o?Object.assign(o,f):D.objetivos.push(f)});toast('Objetivos guardados');render()},
  async guardarCfg(){const v=k=>Math.max(0,+($(`[data-cfg="${k}"]`).value)||0);const data=Object.assign({},D.config,{precios:{local:v('local'),encendido:v('encendido')},fijos:v('fijos'),porLocal:v('porLocal'),fondoPct:Math.min(100,v('fondoPct'))});
    const r=await sb.from('taca_vt_config').upsert({id:1,data});if(r.error)return toast('No se pudo guardar',1);D.config=data;await recargarMet();toast('Guardado');render()}
};
const FORM={
  async entrar(d){LOGIN.msg='';const r=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.pass});if(r.error){LOGIN={modo:'entrar',msg:'Mail o contraseña incorrectos.',mal:1,email:d.email.trim()};return render()}SES=r.data.session;await iniciar()},
  async crear(d){const r=await sb.auth.signUp({email:d.email.trim(),password:d.pass,options:{emailRedirectTo:location.origin+'/equipo/'}});if(r.error){LOGIN={modo:'crear',msg:r.error.message.includes('registered')?'Ese mail ya tiene cuenta: entrá o recuperá la contraseña.':'No se pudo crear la cuenta. Probá de nuevo.',mal:1};return render()}
    if(r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length){LOGIN={modo:'entrar',msg:'Ese mail ya tiene cuenta en ta-ca. Entrá con la misma contraseña que usás en la app (o tocá "Me olvidé la contraseña").',email:d.email.trim()};return render()}
    if(r.data.session){SES=r.data.session;return iniciar()}LOGIN={modo:'entrar',msg:'Listo. Te mandamos un mail para confirmar la cuenta (mirá también en Spam): abrilo y después entrá acá.',email:d.email.trim()};render()},
  async olvido(d){await sb.auth.resetPasswordForEmail(d.email.trim(),{redirectTo:location.origin+'/equipo/'});LOGIN={modo:'entrar',msg:'Si ese mail tiene cuenta, te llegó un link para elegir otra contraseña.'};render()},
  async nueva(d){const r=await sb.auth.updateUser({password:d.pass});if(r.error){LOGIN={modo:'nueva',msg:'No se pudo cambiar. Probá de nuevo.',mal:1};return render()}LOGIN={modo:'entrar',msg:''};toast('Contraseña cambiada');await iniciar()},
  async guardarC(d,f){const c=D.contactos.find(x=>x.id===f.dataset.id);if(!c)return;
    const antes=ESTADOS.indexOf(c.estado),desp=ESTADOS.indexOf(d.estado),citaAntes=c.estado+'|'+(c.fecha||'')+'|'+(c.hora||'');
    const cambios={estado:d.estado,vendedor:d.vendedor||null,proximo:d.proximo.trim()||null,fecha:d.fecha||null,hora:d.hora||null,notas:d.notas.trim()||null,telefono:d.telefono.trim()||null,whatsapp:d.whatsapp.replace(/\D/g,'')||null,actualizado:new Date().toISOString(),actualizado_por:YO.id};
    if(!cambios.vendedor&&desp>0&&desp<7)cambios.vendedor=YO.id;
    const r=await sb.from('taca_vt_contactos').update(cambios).eq('id',c.id);if(r.error)return toast('No se pudo guardar: '+r.error.message,1);
    Object.assign(c,cambios);
    const nuevos=[];
    if(desp>0&&desp<7)Object.keys(HITOS).map(Number).filter(k=>k<=desp&&(k>antes||antes===7)).forEach(k=>{const tipo=HITOS[k];if(yaHito(c.id,tipo))return;
      const fila={miembro:YO.id,contacto_id:c.id,tipo,detalle:c.nombre};if(tipo==='venta'){fila.plan=d.plan||'local';fila.monto=cfg().precios[fila.plan]||0}nuevos.push(fila)});
    if(nuevos.length){const a=await sb.from('taca_vt_actividad').insert(nuevos).select();if(a.error)toast('Se guardó el local pero no se contó el avance',1);else D.actividad=a.data.concat(D.actividad)}
    const cita=c.estado==='Demo agendada'&&c.fecha&&citaAntes!==c.estado+'|'+c.fecha+'|'+(c.hora||'');
    if(cita){render();return modal(`<h2>Cita agendada</h2><p class="muted" style="margin:0 0 4px">${esc(c.nombre)} · ${esc(fechaCorta(c.fecha))}${c.hora?' a las '+esc(c.hora):''}</p><p style="margin:0 0 12px;font-size:14px">Agregala a tu calendario y te llega el aviso antes de la cita. El equipo la ve en <b>Próximas citas</b>.</p><div class="acciones">${botonesCita(c)}</div><div class="btns"><button type="button" data-a="cerrar">Listo</button></div>`)}
    cerrar();toast(nuevos.some(n=>n.tipo==='venta')?'¡Venta! Se sumó tu comisión':'Guardado');render()},
  async crearC(d){const nro=Math.max(0,...D.contactos.map(c=>c.nro||0))+1;const c={id:'c'+uid(),nro,nombre:d.nombre.trim(),tipo:d.tipo,zona:d.zona.trim()||null,direccion:d.direccion.trim()||null,telefono:d.telefono.trim()||null,instagram:d.instagram.trim()||null,prioridad:'Alta',vendedor:YO.id,estado:'Sin contactar',actualizado_por:YO.id};
    const r=await sb.from('taca_vt_contactos').insert(c).select().single();if(r.error)return toast('No se pudo agregar',1);D.contactos.push(r.data);cerrar();toast('Local agregado');render()},
  async crearT(d){const t={id:'t'+uid(),mes:MES,titulo:d.titulo.trim(),asignado:d.asignado,vence:d.vence||null,creado_por:YO.id};const r=await sb.from('taca_vt_tareas').insert(t).select().single();if(r.error)return toast('No se pudo crear',1);D.tareas.push(r.data);cerrar();render()},
  async guardarM(d,f){const id=f.dataset.id||norm(d.nombre).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'p'+uid();
    const fila={id,nombre:d.nombre.trim(),email:d.email.trim().toLowerCase()||null,rol:d.rol,parte:Math.min(100,Math.max(0,+d.parte||0)),activo:!!d.activo};
    if(id===YO.id){fila.activo=true;fila.admin=true}
    const r=await sb.from('taca_vt_equipo').upsert(fila).select().single();if(r.error)return toast(r.error.message.includes('unique')?'Ese mail ya está en otra persona':'No se pudo guardar',1);
    const i=D.equipo.findIndex(x=>x.id===id);i>=0?D.equipo[i]=r.data:D.equipo.push(r.data);
    const socios=D.equipo.filter(x=>x.activo&&x.rol==='socio').reduce((s,x)=>s+(+x.parte||0),0);cerrar();render();toast(socios!==100?`Ojo: las partes de los socios suman ${socios}%`:'Guardado',socios!==100)}
};

document.addEventListener('click',e=>{const ov=e.target.closest('[data-ov]');if(ov&&e.target===ov)return cerrar();const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b)}});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));f.querySelectorAll('input[type=checkbox]').forEach(c=>d[c.name]=c.checked);const bt=f.querySelector('[type=submit]');if(bt)bt.disabled=true;try{await FORM[f.dataset.f](d,f)}catch(err){toast('Algo falló. Probá de nuevo',1)}finally{if(bt)bt.disabled=false}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.fil;if(k==='q'){F.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('[data-fil=q]');if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.fil;if(k&&k!=='q'){F[k]=e.target.value;render()}if(e.target.dataset&&e.target.dataset.estado){const p=$('#planVenta');if(p)p.style.display=e.target.value==='Pagó'?'':'none'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)cerrar()});

function render(){const app=$('#app');
  if(!sb){app.innerHTML='<div class="login"><div class="card"><h2>Sin conexión</h2><p class="muted">No se pudo cargar. Revisá internet y recargá la página.</p></div></div>';return}
  if(!SES||LOGIN.modo==='nueva'){app.innerHTML=vLogin();return}
  if(!YO){app.innerHTML=CARG?'<p class="muted" style="text-align:center;margin-top:30vh">Cargando…</p>':vSinAcceso();return}
  app.innerHTML=vApp()}

async function iniciar(){
  CARG=true;render();
  const r=await sb.rpc('taca_vt_yo_id');const id=r.data;
  if(!id){YO=null;CARG=false;return render()}
  try{await cargar()}catch(e){CARG=false;toast('No se pudieron cargar los datos',1)}
  YO=miembro(id)||null;CARG=false;render();
}
(async()=>{
  try{sb=window.supabase.createClient(NUBE.url,NUBE.key,{auth:{persistSession:true,detectSessionInUrl:true}})}catch(e){sb=null}
  if(!sb)return render();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){SES=s;LOGIN={modo:'nueva',msg:''};render()}});
  const {data}=await sb.auth.getSession();SES=data.session;
  if(SES&&LOGIN.modo!=='nueva')await iniciar();else render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
  setInterval(async()=>{if(YO&&document.visibilityState==='visible'&&!$('#modal').innerHTML){try{await cargar();render()}catch(e){}}},90000);
})();
</script>
</body>
</html>
