const DELTA=new Set(['stock','nextNum','gastado','pedidos']);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null)&&new Set(a.map(x=>x.id)).size===a.length;
function makeDiff(a,b,key){
  if(JSON.stringify(a)===JSON.stringify(b))return null;
  if(typeof a==='number'&&typeof b==='number'&&DELTA.has(key))return{t:'d',v:b-a};
  if(isObj(a)&&isObj(b)){const ch={},del=[];let n=0;
    for(const k of Object.keys(b)){const d=makeDiff(a[k],b[k],k);if(d){ch[k]=d;n++}}
    for(const k of Object.keys(a))if(!(k in b)){del.push(k);n++}
    return n?{t:'o',ch,del}:null}
  if(idArr(a)&&idArr(b)){const A=new Map(a.map(x=>[x.id,x])),B=new Map(b.map(x=>[x.id,x]));const add=[],rm=[],ch={};let n=0;
    for(const [id,x] of B){if(!A.has(id)){add.push(clone(x));n++}else{const d=makeDiff(A.get(id),x);if(d){ch[id]=d;n++}}}
    for(const id of A.keys())if(!B.has(id)){rm.push(id);n++}
    return n?{t:'a',add,rm,ch}:null}
  return{t:'s',v:clone(b)};
}
function applyDiff(t,d){
  if(!d)return t;
  if(d.t==='s')return clone(d.v);
  if(d.t==='d')return r3((typeof t==='number'?t:0)+d.v);
  if(d.t==='o'){if(!isObj(t))t={};for(const k in d.ch)t[k]=applyDiff(t[k],d.ch[k]);d.del.forEach(k=>delete t[k]);return t}
  if(d.t==='a'){if(!Array.isArray(t))t=[];t=t.filter(x=>!(x&&d.rm.includes(x.id)));
    for(const id in d.ch){const i=t.findIndex(x=>x&&String(x.id)===id);if(i>=0)t[i]=applyDiff(t[i],d.ch[id])}
    d.add.forEach(x=>{if(!t.some(y=>y&&y.id===x.id))t.push(clone(x))});return t}
  return t;
}
function renumerar(m,remoto){

    if(SY.sinPin){SY.sinPin=false;SY.base=null;

      if(g){SY.guard=null;ls('taca-guard',null);SY.base=g.base;S=g.S;SY.ver=0;fusionar(r.data,r.version);push();estadoNube('ok');toast('Se subieron los cambios que habían quedado guardados en este equipo ✓');return}}
    if(!SY.base){S=completar(r.data);SY.base=clone(r.data);SY.ver=r.version;saveLocal();persistSync();renderSafe()}
    else if(r.version>SY.ver){fusionar(r.data,r.version);push()}
    else if(makeDiff(SY.base,S))push();
    estadoNube('ok');
  }catch(e){estadoNube('off')}
  if(!SY.escucha){SY.escucha=true;NB.escuchar(LID,()=>pull());setInterval(revisar,5000)}
}
async function conectarCodigo(code){

  try{const r=await NB.leer(code);if(!r)return toast('No existe un local con ese código',1);

}

const CLAVES_DUENO=['equipo','cierres','descMax','alias','negocio','mesas','baseUrl','tipo','setup','envio','plano','mpqr'];
function filtrarRol(d,r){if(r==='dueno')return d;const x=clone(d);x.cierres=[];x.audit=[];return x}
function fusionarRol(o,n,r){if(r==='dueno')return n;const x=clone(n);CLAVES_DUENO.forEach(k=>{if(k in o)x[k]=clone(o[k]);else delete x[k]});
  const ia=new Set((o.audit||[]).map(a=>a.id));x.audit=(o.audit||[]).concat((n.audit||[]).filter(a=>!ia.has(a.id)));
  const ic=new Set((n.cobros||[]).map(c=>c.id));x.cobros=(n.cobros||[]).concat((o.cobros||[]).filter(c=>!ic.has(c.id)));return x}

function errMsg(e){const m=String((e&&(e.message||e.error_description||e.msg))||e||'');

  if(/sending.*email|error sending|smtp/i.test(m))return'No pudimos mandar el email en este momento. Probá de nuevo en unos minutos o escribinos por WhatsApp';
  if(/not confirmed/i.test(m))return'Todavía no confirmaste tu email: revisá tu casilla (y la carpeta de spam)';
  if(/already registered|already been registered/i.test(m))return'Ya hay una cuenta con ese email: entrá con tu contraseña';
  if(/at least 6|password should/i.test(m))return'La contraseña tiene que tener al menos 6 caracteres';
  if(/rate limit|too many|security purposes/i.test(m))return'Demasiados intentos seguidos, esperá unos minutos';
  if(/invalid.*email|email.*invalid/i.test(m))return'Revisá el email, parece que está mal escrito';

// PIN sin internet: después de cada ingreso verificado por el servidor, este equipo guarda una huella del PIN (no el PIN)
async function huellaPin(pin){const sal=ls('taca-pinsal')||(()=>{const x=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');ls('taca-pinsal',x);return x})();
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(LID+':'+pin),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(sal),iterations:150000,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pinRecordar(pin,p){try{if(!crypto.subtle)return;const h=await huellaPin(pin),m=JSON.parse(ls('taca-pinloc')||'{}');Object.keys(m).forEach(k=>{if(m[k].id===p.id&&m[k].l===LID)delete m[k]});m[h]={id:p.id,l:LID,ts:Date.now()};ls('taca-pinloc',JSON.stringify(m))}catch(e){}}
async function pinLocal(pin){try{if(!crypto.subtle)return null;const m=JSON.parse(ls('taca-pinloc')||'{}'),x=m[await huellaPin(pin)];if(!x||x.l!==LID||Date.now()-x.ts>30*864e5)return null;
  const p=(S.equipo||[]).find(q=>q.id===x.id);return p?Object.assign({},p,{offline:true}):null}catch(e){return null}}
async function pinOk(pin,salvo){if(!pinLibre(pin,salvo))return false;if(enNube()&&!EQ&&NB.pinLibre){try{return !!(await NB.pinLibre(LID,pin,salvo))}catch(e){return true}}return true}
function pinLibre(pin,salvo){return /^\d{4,6}$/.test(pin)&&!(S.equipo||[]).some(p=>p.pin===pin&&p.id!==salvo)&&!(W&&W.equipo.some(p=>p.pin===pin))&&!(W&&W.pin===pin&&!salvo)}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(+n).toLocaleString('es-AR',{maximumFractionDigits:3});
const pnum=x=>{const v=parseFloat(String(x??'').replace(/\./g,'').replace(',','.'));return isNaN(v)?0:v};
const pdec=x=>{const v=parseFloat(String(x??'').replace(',','.'));return isNaN(v)?0:v};
const hm=ts=>new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const mins=ts=>Math.floor((Date.now()-ts)/60000);
const hace=ts=>{const m=mins(ts);return m<1?'recién':m<60?m+' min':m<1440?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):Math.floor(m/1440)+' día'+(m>=2880?'s':'')};
const prov=id=>S.proveedores.find(p=>p.id===id);
const yo=()=>{const p=rol&&persona();return p?p.nombre:rol?ROLES[rol].nombre:'Cliente'};
const costoReceta=r=>Object.entries(r).reduce((a,[i,c])=>a+c*(insumo(i)?insumo(i).costo:0),0);
function audit(accion,detalle,monto){S.audit.push({id:uid(),ts:Date.now(),por:yo(),accion,detalle,monto:monto??null})}
function toast(t,err){const d=document.createElement('div');d.className='t'+(err?' err':'');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ---------- lógica del negocio ---------- */
function anular(p){if(p.anulado)return;for(const [ins,c] of Object.entries(p.consumo)){const i=insumo(ins);if(i)i.stock=r3(i.stock+c)}p.anulado=true}
function siguiente(p){return{nuevo:'preparando',preparando:'listo',listo:p.origen==='whatsapp'?'enviado':'entregado'}[p.estado]}
function avanzar(p){
  p.estado=siguiente(p);
  if(p.origen==='whatsapp'&&p.tel===S.wa.tel){
    const t={preparando:`👨‍🍳 Tu pedido *#${p.num}* ya está en preparación.`,listo:`✅ Tu pedido *#${p.num}* está listo, lo estamos por despachar.`,enviado:`🛵 ¡Tu pedido *#${p.num}* salió para ${p.direccion}! Total a pagar: *${fmt(p.total)}*.`}[p.estado];
    if(t)S.wa.msgs.push({from:'bot',t,ts:Date.now()});
  }else if(p.origen==='whatsapp'&&p.tel&&S.waConv&&S.waConv[p.tel]&&waReal()){
    const t={preparando:`👨‍🍳 Tu pedido *#${p.num}* ya está en preparación.`,enviado:`🛵 ¡Tu pedido *#${p.num}* salió para ${p.direccion}! Total a pagar: *${fmt(p.total)}*.`,entregado:`✅ ¡Gracias por tu pedido *#${p.num}*!`}[p.estado];
    if(t)waResponder(p.tel,t,true);
  }
  save();
}
function registrarMerma(ins,cant,motivo){
  const i=insumo(ins);if(!(cant>0))return 'Cantidad inválida';if(cant>i.stock+1e-9)return 'La merma supera el stock disponible';
  i.stock=r3(i.stock-cant);S.mermas.push({id:uid(),ins,cant,motivo,valor:cant*i.costo,ts:Date.now(),por:yo()});
  audit('Merma',`${num(cant)} ${i.u} ${i.nombre} · ${motivo}`,cant*i.costo);save();
}
function abiertos(){return S.pedidos.filter(p=>!p.anulado&&!p.cobrado)}
function grupos(){
  const g={};
  abiertos().forEach(p=>{
    const k=p.origen==='mesa'?'m'+p.mesa:p.origen==='mostrador'?'p'+p.num:'w'+p.num;
    g[k]=g[k]||{key:k,nombre:p.origen==='mesa'?'Mesa '+p.mesa:p.origen==='mostrador'?'🥡 Para llevar #'+p.num+' · '+p.cliente:'🛵 Delivery #'+p.num+' · '+p.cliente,peds:[],total:0,cuenta:false,medioDecl:null};
    g[k].peds.push(p);g[k].total+=p.total;if(p.pideCuenta)g[k].cuenta=true;if(p.medio)g[k].medioDecl=p.medio;
  });
  return Object.values(g).sort((a,b)=>b.cuenta-a.cuenta);
}
function pedidosDeGrupo(k){return abiertos().filter(p=>k[0]==='m'?p.origen==='mesa'&&p.mesa==k.slice(1):p.origen===(k[0]==='p'?'mostrador':'whatsapp')&&p.num==k.slice(1))}
function registrarCobro(peds,o){
  const c={id:uid(),ts:Date.now(),turno:S.turno?S.turno.id:null,por:o.por||yo(),grupo:o.nombre,pedidos:peds.map(p=>p.id),subtotal:o.subtotal,descPct:o.descPct||0,descuento:o.descuento||0,propina:o.propina||0,total:o.total,pagos:o.pagos,anulado:false};
  peds.forEach(p=>{p.cobrado=true;p.cobroId=c.id;p.pideCuenta=false});
  S.cobros.push(c);
  if(c.descuento>0)audit('Descuento',`${c.grupo}: ${c.descPct}%`,c.descuento);
  save();return c;
}
function calc(){
  const v=S.pedidos.filter(p=>!p.anulado),cobs=S.cobros.filter(c=>!c.anulado);
  const porMedio={efectivo:0,mp:0,tarjeta:0,transferencia:0};cobs.forEach(c=>Object.entries(c.pagos).forEach(([m,x])=>porMedio[m]+=x));
  const porCanal={QR:0,Mozo:0,WhatsApp:0,Mostrador:0};v.forEach(p=>porCanal[p.origen==='whatsapp'?'WhatsApp':p.origen==='mostrador'?'Mostrador':p.por==='QR'?'QR':'Mozo']+=p.total);
  const brutas=v.reduce((a,p)=>a+p.total,0),descuentos=cobs.reduce((a,c)=>a+c.descuento,0),propinas=cobs.reduce((a,c)=>a+c.propina,0);
  const ventas=brutas-descuentos,pendiente=v.filter(p=>!p.cobrado).reduce((a,p)=>a+p.total,0);
  const egresos=S.egresos.reduce((a,e)=>a+e.monto,0),saldo=S.apertura+porMedio.efectivo-egresos;
  const consumo={};v.forEach(p=>Object.entries(p.consumo).forEach(([i,c])=>consumo[i]=r3((consumo[i]||0)+c)));
  const costoVendido=Object.entries(consumo).reduce((a,[i,c])=>a+c*(insumo(i)?insumo(i).costo:0),0);
  const merma={};S.mermas.forEach(m=>{merma[m.ins]=merma[m.ins]||{cant:0,valor:0};merma[m.ins].cant=r3(merma[m.ins].cant+m.cant);merma[m.ins].valor+=m.valor});
  const costoMerma=S.mermas.reduce((a,m)=>a+m.valor,0),stockValor=S.insumos.reduce((a,i)=>a+i.stock*i.costo,0);
  const platos={};v.forEach(p=>p.items.forEach(i=>{platos[i.id]=platos[i.id]||{nombre:i.nombre,cant:0,ventas:0};platos[i.id].cant+=i.cant;platos[i.id].ventas+=i.precio*i.cant}));
  const porHora={};v.forEach(p=>{const h=new Date(p.ts).getHours();porHora[h]=(porHora[h]||0)+p.total});
  return{v,cobs,porMedio,porCanal,brutas,descuentos,propinas,ventas,pendiente,egresos,saldo,consumo,costoVendido,merma,costoMerma,stockValor,platos,porHora,
    bajos:S.insumos.filter(i=>i.stock<=i.min),tickets:v.length,ganancia:ventas-costoVendido-costoMerma};
}
function ingenieria(c){
  const rows=S.platos.map(p=>{const x=c.platos[p.id]||{cant:0,ventas:0};const costo=costoReceta(p.receta);return{p,cant:x.cant,margen:p.precio-costo,pct:p.precio?1-costo/p.precio:0}}).filter(r=>r.p.activo!==false);
  const tot=rows.reduce((a,r)=>a+r.cant,0);if(!tot)return[];
  const popMin=tot/rows.length*.7,margProm=rows.reduce((a,r)=>a+r.margen*r.cant,0)/tot;
  return rows.map(r=>{const pop=r.cant>=popMin,rent=r.margen>=margProm;
    r.cls=pop&&rent?['estrella','⭐ Estrella','Mantenela y destacala en la carta']:pop?['caballo','🐴 Caballo de batalla','Se vende mucho pero deja poco: subí un poco el precio o bajá el costo']:rent?['enigma','🧩 Enigma','Deja buena ganancia pero se pide poco: promocionala o que la recomiende el mozo']:['perro','🐶 Perro','Se vende poco y deja poco: revisala o sacala de la carta'];return r}).sort((a,b)=>b.cant-a.cant);
}

function badge(t){
  let n=0;
  if(t==='cocina')n=S.pedidos.filter(p=>!p.anulado&&p.estado==='nuevo').length;
  if(t==='caja')n=grupos().filter(g=>g.cuenta).length;
  if(t==='salon')n=S.llamados.length+grupos().filter(g=>g.cuenta&&g.key[0]==='m').length;
  if(t==='stock')n=S.insumos.filter(i=>i.stock<=i.min).length;
  return n?`<span class="b">${n}</span>`:'';
}

function achicarFoto(file,max,cal){return new Promise((ok,mal)=>{const u=URL.createObjectURL(file),im=new Image();

  const n=Math.max(0,Math.floor(Math.min(...r.map(x=>x.i.stock/x.c))+1e-6)),lim=r.reduce((a,x)=>x.i.stock/x.c<a.i.stock/a.c?x:a);

function eCosto(){const r={};E.receta.forEach(x=>{if(x.ins&&pdec(x.cant)>0)r[x.ins]=(r[x.ins]||0)+pdec(x.cant)});const c=costoReceta(r),pr=pnum(E.precio);

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const loc=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(loc,name,data);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=loc.length+name.length+data.length});
  const csize=cen.reduce((a,x)=>a+x.length,0);
  return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(csize),...u32(off),0,0])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(hojas){const x=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const hoja=h=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${(h.anchos||h.filas[0].map(()=>16)).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${h.filas.map((f,r)=>`<row r="${r+1}">${f.map((v,c)=>{const ref=col(c)+(r+1);
    if(typeof v==='number'&&isFinite(v))return`<c r="${ref}" s="${r===0?1:Number.isInteger(v)?2:3}"><v>${v}</v></c>`;return`<c r="${ref}" t="inlineStr" s="${r===0?1:0}"><is><t xml:space="preserve">${x(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${hojas.map((h,i)=>`<sheet name="${x(h.nombre.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}
  ].concat(hojas.map((h,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:hoja(h)})));
  return zipStore(files)}

function rango(per,desde,hasta){const d=new Date();d.setHours(0,0,0,0);let a,b;
  if(per==='semana'){a=new Date(d);a.setDate(d.getDate()-((d.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+7)}
  else if(per==='mes'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,1)}
  else if(per==='mespasado'){a=new Date(d.getFullYear(),d.getMonth()-1,1);b=new Date(d.getFullYear(),d.getMonth(),1)}
  else if(per==='30'){b=new Date(d);b.setDate(d.getDate()+1);a=new Date(b);a.setDate(b.getDate()-30)}
  else{a=new Date((desde||fechaISO())+'T00:00:00');b=new Date((hasta||fechaISO())+'T00:00:00');b.setDate(b.getDate()+1)}
  const len=b-a,pa=new Date(+a-len);return{a,b,pa,pb:a}}

function route(){pantallaMode=location.hash==='#pantalla';const m=location.hash.match(/^#mesa-(\d+)$/);clienteMode=m?+m[1]:null;if(clienteMode&&C.mesa!==clienteMode){C.mesa=clienteMode;C.cart=[]}render();if(cloudClient())cargarCarta()}
window.addEventListener('hashchange',route);
window.addEventListener('storage',e=>{if(NB||e.key!==K||!e.newValue)return;try{S=JSON.parse(e.newValue)}catch(x){return}renderSafe()});
setInterval(()=>{if(!busy()&&!$('#modal').innerHTML&&(pantallaMode||((tab==='cocina'||tab==='salon')&&!clienteMode)))render()},pantallaMode?5000:30000);
(function volverMP(){
  const mm=QS_PRE('mpmesa'),mc=QS_PRE('mpcuenta'),me=QS_PRE('mesa');
  if(!mm&&!mc)return;
  const q=new URLSearchParams(location.search);['mpmesa','mpcuenta','mesa','status','collection_status','collection_id','payment_id','payment_type','merchant_order_id','preference_id','site_id','processing_mode','merchant_account_id','external_reference'].forEach(k=>q.delete(k));
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+(me&&/^\d+$/.test(me)?'#mesa-'+me:location.hash));
  setTimeout(()=>{
    if(mm==='ok')modal('<h2>¡Pago aprobado! 🙌</h2><p class="muted">Gracias. El pago ya le llega al local y la mesa queda cobrada. No hace falta que pidas la cuenta.</p><div class="btns"><button class="primary" data-a="close">Listo</button></div>');
    else if(mm==='pendiente')toast('Tu pago quedó pendiente en Mercado Pago. Avisale al mozo.');
    else if(mm)toast('El pago no se completó. Podés probar de nuevo o pedir la cuenta.',1);
    if(mc==='ok'){MPC=null;tab='mesas';render();toast('¡Listo! Tu Mercado Pago quedó conectado ✅')}
    else if(mc==='cancelado')toast('No se conectó: cancelaste en Mercado Pago.',1);
    else if(mc==='vencido')toast('Pasó mucho tiempo, tocá Conectar de nuevo.',1);
    else if(mc)toast('No se pudo conectar Mercado Pago. Probá de nuevo.',1);
  },900);
})();
/* ---------- botón Atrás del celular: cierra ventanas, vuelve de pantalla y pregunta antes de salir ---------- */
let TABH=[],SALIENDO=false;
// Chrome en Android saltea los pasos de historial agregados sin un toque del usuario.
// Por eso el "seguro" se vuelve a poner con el primer toque después de cada uso.
let ATRAS_TOQUE=false;
function atrasArmar(conToque){try{const st=history.state||{};
  if(st.taca&&(st.toque||!conToque))return;
  history.pushState({taca:1,toque:!!conToque},'',location.href);if(conToque)ATRAS_TOQUE=true}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(!SALIENDO&&!pantallaMode&&!(history.state&&history.state.toque))atrasArmar(true)},{capture:true,passive:true}));
let ATRAS_HASH=location.hash;
window.addEventListener('hashchange',()=>{ATRAS_HASH=location.hash});
window.addEventListener('popstate',()=>{
  if(location.hash!==ATRAS_HASH){ATRAS_HASH=location.hash;return} // cambio de # (otra pantalla de la app), no es "atrás"
  if(pantallaMode)return;
  if(SALIENDO){if(SALIENDO<6){SALIENDO++;history.back()}return}
  const abierto=!!$('#modal').innerHTML.trim();
  if(abierto&&document.querySelector('#modal [data-a=salirApp]')){closeModal();atrasArmar();return}
  if(abierto){if(QRP&&document.getElementById('qrmp')){QRP=null}closeModal();atrasArmar();renderSafe();return}
  if(typeof MAS!=='undefined'&&MAS){MAS=false;render();atrasArmar();return}
  if(!clienteMode&&TABH.length){tab=TABH.pop();render();scrollTo(0,0);atrasArmar();return}
  const carrito=clienteMode&&C.cart&&C.cart.length;
  modal(`<h2>¿Querés salir de ta-ca?</h2><p class="muted" style="margin-top:0">${carrito?'Tenés un pedido sin enviar: si salís, se pierde.':'Tocaste “atrás” en la primera pantalla.'}</p><div class="btns"><button class="primary" data-a="quedarme">Quedarme</button><button class="ghost" data-a="salirApp">Salir</button></div>`);
});
Object.assign(A,{
  quedarme(){closeModal();atrasArmar()},
  salirApp(){SALIENDO=1;closeModal();try{window.close()}catch(e){}
    setTimeout(()=>{if(document.visibilityState==='visible'){history.back();setTimeout(()=>{if(document.visibilityState==='visible')toast('Tocá “atrás” una vez más para salir')},400)}},250);
    setTimeout(()=>{SALIENDO=false},6000)}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!SALIENDO)atrasArmar()});
atrasArmar();
route();
/* errores de la app: le llegan a Roman Web (panel y Telegram). Uno por tipo y como mucho 5 por sesión. */
(function(){const vistos=new Set();let n=0;
  function avisar(msg,stack,donde){msg=String(msg||'');if(location.protocol!=='https:'||QS.get('mock')||n>=5)return;
    if(/ResizeObserver|Failed to fetch|NetworkError|Load failed|network|AbortError|Script error\.?$|chrome-extension|moz-extension|safari-extension/i.test(msg+' '+(stack||'')))return;
    const k=msg.slice(0,120);if(vistos.has(k))return;vistos.add(k);n++;
    try{fetch('/api/alerta',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:msg,local:LID||CLID||null,detalle:{donde:(clienteMode?'QR mesa '+clienteMode:pantallaMode?'pantalla':tab||'inicio')+' · '+location.pathname,rol:rol||(EQ?'equipo':''),stack:String(stack||'').slice(0,800)}})}).catch(()=>{})}catch(e){}}
  window.addEventListener('error',e=>{if(e.filename&&!e.filename.startsWith(location.origin))return;avisar(e.message,e.error&&e.error.stack)});
  window.addEventListener('unhandledrejection',e=>{const r=e.reason;avisar(r&&r.message||String(r),r&&r.stack)});})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!QS.get('mock')){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
window.addEventListener('online',()=>{if(enNube()){push();pull()}else if(cloudClient())cargarCarta()});
window.addEventListener('offline',()=>{if(enNube())estadoNube('off')});
arrancarCuentas();
if(cloudClient()){NB.escuchar(CLID,()=>cargarCarta());setInterval(cargarCarta,5000)}
</script>
